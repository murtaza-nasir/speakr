name: Tests

# Runs the full automated suite on every branch push (master excepted) and
# every pull request. The existing
# docker-publish.yml only ran two migration tests on release, so nothing
# guarded day-to-day changes; this workflow gives the ~378 Python tests + the
# Vitest JS tests real per-commit regression protection.
#
# Syntax is standard GitHub Actions and also runs on Forgejo Actions
# (Forgejo reads .github/workflows by default). The Python suite isolates
# itself to a throwaway SQLite DB via conftest.py, so it needs no app config.
# python-tests-postgres runs the same suite on PostgreSQL.

on:
  # master and tags are not tested again: master is moved only by ship.sh, to
  # a commit whose run on a ci/ branch passed, and a release tag is put on
  # that same commit.
  push:
    branches-ignore: [master]
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

# Read-only by default; a job that needs more declares it
permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: speakr
          POSTGRES_PASSWORD: speakr
          POSTGRES_DB: speakr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U speakr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ffmpeg (needed by stitch / ffprobe tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install --require-hashes --no-deps -r requirements.lock -r requirements-dev.lock

      # The pinned Tailwind CLI is downloaded once per version and kept, so a
      # failing GitHub release download does not fail the tests.
      - name: Cache the Tailwind CLI
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v6.1.0
        with:
          path: .cache/tailwindcss
          key: tailwindcss-${{ runner.os }}-${{ hashFiles('scripts/build_css.sh') }}

      - name: Build the Tailwind stylesheet as the image build does
        run: scripts/build_css.sh

      - name: Run test suite
        env:
          # The app tests run against an isolated SQLite DB (see conftest.py).
          # test_postgres_migrations.py reads TEST_DATABASE_URI separately so it
          # exercises real PostgreSQL compatibility against the service above.
          TEST_DATABASE_URI: postgresql://speakr:speakr@localhost:5432/speakr_test
        run: pytest tests/ -q -n 4 --dist loadfile --cov=src --cov-report=term-missing

  # The same suite on PostgreSQL, the database of most deployments. SQLite
  # does not enforce column lengths or foreign keys the way PostgreSQL does,
  # so a test (or a code path) that only works on SQLite fails here.
  python-tests-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: speakr
          POSTGRES_PASSWORD: speakr
          POSTGRES_DB: speakr_suite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U speakr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ffmpeg (needed by stitch / ffprobe tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install --require-hashes --no-deps -r requirements.lock -r requirements-dev.lock

      # The pinned Tailwind CLI is downloaded once per version and kept, so a
      # failing GitHub release download does not fail the tests.
      - name: Cache the Tailwind CLI
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v6.1.0
        with:
          path: .cache/tailwindcss
          key: tailwindcss-${{ runner.os }}-${{ hashFiles('scripts/build_css.sh') }}

      - name: Build the Tailwind stylesheet as the image build does
        run: scripts/build_css.sh

      - name: Run test suite on PostgreSQL
        env:
          # conftest.py points the app at this database instead of SQLite and
          # gives each xdist worker a database of its own (speakr_suite_gw0,
          # ...), so four workers do not create the schema in the same place.
          # The migration tests read TEST_DATABASE_URI, which is not set
          # here, so they cannot drop the suite's tables.
          PYTEST_DATABASE_URI: postgresql://speakr:speakr@localhost:5432/speakr_suite
        run: pytest tests/ -q -p no:cacheprovider --timeout=120 -n 4 --dist loadfile --durations=15

  # Speakr and whisperx-asr-service set up exactly as their docs describe
  # (config/env.whisperx.example; the service's docker-compose.yml plus its
  # SETUP_GUIDE .env block), talking over HTTP. The service runs its real code
  # on stand-in ML packages, so this needs no GPU, secrets or model downloads.
  # It would have caught #409. Also checks that the model rules vendored in
  # tests/contract still match the service's own code.
  e2e-whisperx-defaults:
    runs-on: ubuntu-latest
    env:
      WHISPERX_REF: ${{ vars.WHISPERX_REF || 'main' }}

    steps:
      - name: Checkout Speakr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout whisperx-asr-service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: murtaza-nasir/whisperx-asr-service
          ref: ${{ env.WHISPERX_REF }}
          path: whisperx

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install --require-hashes --no-deps -r requirements.lock -r requirements-dev.lock
          python -m venv /tmp/wxv
          /tmp/wxv/bin/pip install -r whisperx/tests/requirements-ci.txt

      - name: Start whisperx-asr-service (documented settings, stand-in models)
        run: |
          /tmp/wxv/bin/python whisperx/tests/e2e/stub_server.py --port 9000 \
            --env-file whisperx/tests/defaults/minimal.env > /tmp/whisperx.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:9000/health && break; sleep 1; done
          curl -fs http://127.0.0.1:9000/health

      - name: Contract - vendored model rules match the service
        env:
          WHISPERX_REPO: whisperx
          WHISPERX_PYTHON: /tmp/wxv/bin/python
        run: pytest tests/contract -q -p no:cacheprovider

      - name: End to end with the documented settings
        env:
          SPEAKR_E2E: '1'
          WHISPERX_URL: http://127.0.0.1:9000
          WHISPERX_LOG: /tmp/whisperx.log
        run: pytest tests/e2e -q -p no:cacheprovider -rxs

      - name: Service log
        if: always()
        run: tail -n 200 /tmp/whisperx.log || true

  lock-check:
    # The lock files pin every package with its hashes; they must match
    # requirements.txt and requirements-embeddings.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lock files match the requirements
        run: scripts/lock-requirements.sh --check

  dependency-audit:
    # The locked packages against the published advisories (pip-audit);
    # accepted advisories are in scripts/audit-exceptions.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit==2.9.0
      - name: Audit the lock files
        run: scripts/audit-dependencies.sh

  # The browser suite runs as four shards on four runners. Each shard starts
  # its own Speakr instance, so the files are independent, and a failure is
  # isolated to one job. tests/e2e/shards.py spreads every
  # tests/e2e/test_*_ui.py file and the smoke test over the shards by their
  # measured run time, so a new browser test file runs in one of them
  # without an edit here (#643); --durations=15 reports drift in each log.
  browser-smoke-shards:
    # Opens every page in headless Chromium and fails on failed requests,
    # JavaScript errors, leftover template text, or a header whose user menu
    # does not open (tests/e2e/test_browser_smoke.py). Vendor files are
    # downloaded exactly as the Dockerfile does it, in production mode, so a
    # reference to a file the image lacks fails here. The Tailwind stylesheet
    # is compiled with the same pinned CLI as the Dockerfile css-stage.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip

      # The waveform of the segment editor's timeline is computed with ffmpeg
      # (GET /audio/<id>/peaks); test_asr_editor_ui.py waits for it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install --require-hashes --no-deps -r requirements.lock -r requirements-dev.lock

      - name: Download vendor files as the image build does
        run: PRODUCTION=1 python scripts/download_offline_deps.py

      # The pinned Tailwind CLI is downloaded once per version and kept, so a
      # failing GitHub release download does not fail the tests.
      - name: Cache the Tailwind CLI
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v6.1.0
        with:
          path: .cache/tailwindcss
          key: tailwindcss-${{ runner.os }}-${{ hashFiles('scripts/build_css.sh') }}

      - name: Build the Tailwind stylesheet as the image build does
        run: scripts/build_css.sh

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # --control-port: test_offline_recorder_ui.py stops and starts the
      # server on 8898, as a server that is down looks to the browser.
      - name: Start Speakr (config/env.whisperx.example)
        run: |
          python tests/e2e/run_speakr.py --port 8899 --control-port 8898 --workdir /tmp/speakr-smoke > /tmp/speakr.log 2>&1 &
          for i in $(seq 1 90); do curl -fs -o /dev/null http://127.0.0.1:8899/login && break; sleep 2; done
          curl -fs -o /dev/null http://127.0.0.1:8899/login
          curl -fs -o /dev/null http://127.0.0.1:8898/state

      # The files of this shard run on the shard's own instance, the smoke
      # test first. Each module restores the settings it changes.
      # SPEAKR_E2E_STRICT: a test that finds no seeded recordings (or no
      # Inquire, no public links) fails instead of skipping, since
      # run_speakr.py always provides them (#641).
      - name: Browser tests, shard ${{ matrix.shard }}
        env:
          SPEAKR_BROWSER_SMOKE: '1'
          SPEAKR_E2E_STRICT: '1'
          SPEAKR_BASE_URL: http://127.0.0.1:8899
          SPEAKR_CONTROL_URL: http://127.0.0.1:8898
        run: |
          FILES=$(python tests/e2e/shards.py ${{ matrix.shard }} 4)
          echo "shard ${{ matrix.shard }}: $FILES"
          pytest $FILES -q -p no:cacheprovider --noconftest -rs --durations=15

      - name: Speakr log
        if: always()
        run: tail -n 200 /tmp/speakr.log || true

  browser-smoke:
    # The check name the release flow and branch protection know. It only
    # aggregates the shards, so the matrix can gain or lose a shard without
    # renaming the required check.
    needs: browser-smoke-shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          SHARD_RESULT: ${{ needs.browser-smoke-shards.result }}
        run: |
          echo "browser-smoke-shards: $SHARD_RESULT"
          test "$SHARD_RESULT" = "success"

  image-smoke:
    # Builds the lite image for amd64 and opens its pages in a browser
    # (tests/e2e/test_image_smoke.py), with the example settings and an empty
    # database. ship.sh waits for this job with the others, so an image that
    # does not start or lacks a file stops the ship before a release is
    # tagged. The build cache is shared with the publish workflow.
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -af
          df -h /

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build lite image (amd64, local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: speakr:smoke
          cache-from: type=gha,scope=lite-amd64
          cache-to: type=gha,scope=lite-amd64,mode=max
          build-args: |
            PRODUCTION=1
            LIGHTWEIGHT=1

      - name: Start the image with the example settings
        run: |
          python3 tests/e2e/smoke_env.py > smoke.env
          docker run -d --name speakr-smoke -p 8899:8899 --env-file smoke.env speakr:smoke
          for i in $(seq 1 90); do curl -fs -o /dev/null http://127.0.0.1:8899/login && break; sleep 2; done
          curl -fs -o /dev/null http://127.0.0.1:8899/login

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install --require-hashes --no-deps -r requirements-dev.lock
          python -m playwright install --with-deps chromium

      - name: Browser smoke test against the image
        env:
          SPEAKR_BROWSER_SMOKE: '1'
          SPEAKR_BASE_URL: http://127.0.0.1:8899
        run: pytest tests/e2e/test_image_smoke.py -q -p no:cacheprovider --noconftest -rs

      - name: Container log
        if: always()
        run: docker logs speakr-smoke 2>&1 | tail -n 200 || true

  js-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          # No npm cache: package-lock.json is gitignored in this repo, so it's
          # never in the CI checkout. cache: npm (and npm ci) both require a
          # committed lock file, so we use `npm install` below instead.

      - name: Install dependencies
        run: npm install

      - name: Run Vitest
        run: npm test
