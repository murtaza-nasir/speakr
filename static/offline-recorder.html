<!DOCTYPE html>
<!--
  The offline recorder (#650). The service worker (static/sw.js) answers this
  page in place of a page that cannot be loaded, with __SPEAKR_VERSION__
  replaced by its release. It holds no user data: no recording of the
  library, no transcript, no summary, no name. static/js/offline-recorder.js
  fills it in; without that script it is the "You are offline" page.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Offline - Speakr</title>
<link rel="icon" href="/static/img/favicon.ico?v=__SPEAKR_VERSION__">
<link rel="stylesheet" href="/static/css/styles.css?v=__SPEAKR_VERSION__">
<link rel="stylesheet" href="/static/css/offline-recorder.css?v=__SPEAKR_VERSION__">
<script src="/static/js/offline-recorder-theme.js?v=__SPEAKR_VERSION__"></script>
</head>
<body class="or-body">
<div class="or-page">
  <main id="speakr-offline" class="or-card" aria-labelledby="or-title">
    <div class="or-brand"><img src="/static/img/favicon.ico?v=__SPEAKR_VERSION__" alt="" class="or-logo" width="28" height="28"><span>Speakr</span></div>
    <h1 id="or-title" data-or-text="title">You are offline</h1>
    <p id="or-lead" class="or-lead">Speakr cannot be reached. This page is loaded again when the connection is back.</p>

    <section id="or-recorder" class="or-recorder" hidden>
      <!-- The source, as in the in-app recorder (#697): the two with system
           audio need a screen share and are disabled where the browser
           cannot capture one. Icons: Font Awesome's microphone and desktop. -->
      <div id="or-source" class="or-source" hidden>
        <span id="or-source-label" class="or-source-label" data-or-text="recording.source">Source</span>
        <div class="or-seg" role="radiogroup" aria-labelledby="or-source-label">
          <button type="button" role="radio" class="or-seg-item is-active" data-or-mode="microphone" aria-checked="true"><svg class="or-icon" viewBox="0 0 384 512" aria-hidden="true" focusable="false"><path fill="currentColor" d="M192 0C139 0 96 43 96 96v160c0 53 43 96 96 96s96-43 96-96V96c0-53-43-96-96-96zM64 216c0-13.3-10.7-24-24-24s-24 10.7-24 24v40c0 89.1 66.2 162.7 152 174.4V464h-48c-13.3 0-24 10.7-24 24s10.7 24 24 24h144c13.3 0 24-10.7 24-24s-10.7-24-24-24h-48v-33.6c85.8-11.7 152-85.3 152-174.4v-40c0-13.3-10.7-24-24-24s-24 10.7-24 24v40c0 70.7-57.3 128-128 128S64 326.7 64 256v-40z"/></svg><span data-or-text="recording.microphone">Microphone</span></button>
          <button type="button" role="radio" class="or-seg-item" data-or-mode="system" aria-checked="false" tabindex="-1"><svg class="or-icon or-icon--wide" viewBox="0 0 576 512" aria-hidden="true" focusable="false"><path fill="currentColor" d="M64 0C28.7 0 0 28.7 0 64v288c0 35.3 28.7 64 64 64h176l-10.7 32H160c-17.7 0-32 14.3-32 32s14.3 32 32 32h256c17.7 0 32-14.3 32-32s-14.3-32-32-32h-69.3L336 416h176c35.3 0 64-28.7 64-64V64c0-35.3-28.7-64-64-64H64zm448 64v224H64V64h448z"/></svg><span data-or-text="recording.systemAudio">System audio</span></button>
          <button type="button" role="radio" class="or-seg-item" data-or-mode="both" aria-checked="false" tabindex="-1"><span class="or-icons"><svg class="or-icon" viewBox="0 0 384 512" aria-hidden="true" focusable="false"><path fill="currentColor" d="M192 0C139 0 96 43 96 96v160c0 53 43 96 96 96s96-43 96-96V96c0-53-43-96-96-96zM64 216c0-13.3-10.7-24-24-24s-24 10.7-24 24v40c0 89.1 66.2 162.7 152 174.4V464h-48c-13.3 0-24 10.7-24 24s10.7 24 24 24h144c13.3 0 24-10.7 24-24s-10.7-24-24-24h-48v-33.6c85.8-11.7 152-85.3 152-174.4v-40c0-13.3-10.7-24-24-24s-24 10.7-24 24v40c0 70.7-57.3 128-128 128S64 326.7 64 256v-40z"/></svg><svg class="or-icon or-icon--wide" viewBox="0 0 576 512" aria-hidden="true" focusable="false"><path fill="currentColor" d="M64 0C28.7 0 0 28.7 0 64v288c0 35.3 28.7 64 64 64h176l-10.7 32H160c-17.7 0-32 14.3-32 32s14.3 32 32 32h256c17.7 0 32-14.3 32-32s-14.3-32-32-32h-69.3L336 416h176c35.3 0 64-28.7 64-64V64c0-35.3-28.7-64-64-64H64zm448 64v224H64V64h448z"/></svg></span><span data-or-text="recording.microphoneAndSystem">Microphone + system</span></button>
        </div>
        <p id="or-source-hint" class="or-source-hint" data-or-text="recording.systemAudioNotSupported" hidden>System audio can't be recorded in this browser</p>
      </div>
      <div id="or-timer" class="or-timer" hidden>0:00</div>
      <div id="or-left" class="or-left" hidden></div>
      <div class="or-actions">
        <button type="button" id="or-record" class="or-btn or-btn--primary" data-or-text="record">Record</button>
        <button type="button" id="or-stop" class="or-btn or-btn--danger" data-or-text="stop" hidden>Stop and save</button>
      </div>
    </section>
    <p id="or-limit" class="or-note or-note--warn" role="status" aria-live="polite" hidden></p>
    <p id="or-status" class="or-status" role="status" aria-live="polite"></p>
    <p id="or-unavailable" class="or-note" hidden></p>

    <section id="or-pending" class="or-pending" aria-labelledby="or-pending-title" hidden>
      <h2 id="or-pending-title" data-or-text="pendingTitle">Waiting to upload</h2>
      <ul id="or-list" class="or-list"></ul>
    </section>

    <div class="or-footer">
      <a id="or-retry" class="or-btn or-btn--quiet" href="" data-or-text="tryAgain">Try again</a>
    </div>
  </main>
</div>
<script type="module" src="/static/js/offline-recorder.js?v=__SPEAKR_VERSION__"></script>
</body>
</html>
