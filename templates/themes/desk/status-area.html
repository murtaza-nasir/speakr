<!-- Desk: status bar (desktop). Counts on the left, the indicator of the
     processing queue on the right; it opens and minimizes the panel. Under
     it the two parts of the default partial: the panel over the page while
     the list is collapsed (above the status bar here) and the phone sheet. -->
{% from 'components/queue/_queue.html' import queue_indicator %}
<footer class="desk-statusbar" v-show="!isMobileScreen" role="status">
    <span class="desk-statusbar__item tnum" v-text="t('sidebar.totalRecordingsPlural', { count: totalRecordings })"></span>
    <span v-if="selectionMode && selectedCount > 0" class="desk-statusbar__item tnum is-accent" v-text="t('bulkActions.selectedCount', { count: selectedCount })"></span>
    <span class="desk-statusbar__grow"></span>
    <template v-if="queuePopupShown">{{ queue_indicator('status') }}</template>
</footer>
{% from 'components/queue/_queue.html' import queue_panel, queue_rows %}
{% from 'components/phone/_sheet.html' import phone_sheet %}
<div v-if="queuePlace === 'float' && queuePopupShown && queuePanelOpen" class="queue-float"
     :class="{ 'queue-float--status': queueStatusBar }" data-queue-float>
    {{ queue_panel('float') }}
</div>
<template v-if="isMobile">
{% call phone_sheet('queue', "t('progressQueue.title')") %}
<div class="queue-sheet" data-queue-panel="sheet">
    <p v-if="queueParts.length > 0" class="queue-sheet__summary" data-queue-summary v-text="queueSummaryText"></p>
    {{ queue_rows() }}
</div>
{% endcall %}
</template>
