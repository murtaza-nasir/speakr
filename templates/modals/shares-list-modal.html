<!-- Shares List Modal (design system v1). Shared by me: public links, and
     recordings shared with people and groups. Shared with me: recordings
     others shared with this user (#416). -->
<div v-if="showSharesListModal" @click.self="closeSharesList" class="modal-overlay">
    <div class="modal-panel modal-panel--lg">
        <div class="modal-header">
            <h3 class="modal-title" v-text="t('modal.sharedTranscripts')"></h3>
            <button @click="closeSharesList" class="modal-close" :title="t('buttons.close')"><i class="fas fa-times"></i></button>
        </div>
        <div v-if="sharesInternalEnabled" class="tabs px-4" role="tablist">
            <button class="tab" role="tab" :class="{ 'is-active': sharesTab === 'by_me' }" :aria-selected="sharesTab === 'by_me'" @click="sharesTab = 'by_me'">
                <span v-text="t('sharedTranscripts.sharedByMe')"></span>
                <span class="tab__count" v-text="userShares.length + sharesByMe.length"></span>
            </button>
            <button class="tab" role="tab" :class="{ 'is-active': sharesTab === 'with_me' }" :aria-selected="sharesTab === 'with_me'" @click="sharesTab = 'with_me'">
                <span v-text="t('sharedTranscripts.sharedWithMe')"></span>
                <span class="tab__count" v-text="sharesWithMe.length"></span>
            </button>
        </div>
        <div class="modal-body">
            <div v-if="isLoadingShares" class="empty">
                <div class="spinner spinner--lg"></div>
            </div>

            <!-- Shared by me -->
            <div v-else-if="!sharesInternalEnabled || sharesTab === 'by_me'" class="space-y-6">
                <section v-if="sharesPublicEnabled || userShares.length">
                    <h4 class="t-label mb-2 flex items-center gap-2"><i class="fas fa-link"></i><span v-text="t('sharedTranscripts.publicLinks')"></span></h4>
                    <p v-if="userShares.length === 0" class="t-meta" v-text="t('sharedTranscripts.noPublicLinks')"></p>
                    <div v-else class="space-y-3">
                        <div v-for="share in userShares" :key="share.id"
                             class="p-4 rounded-md border border-[var(--border-primary)] bg-[var(--bg-tertiary)]">
                            <div class="flex justify-between items-start gap-3">
                                <div class="min-w-0">
                                    <a :href="'/recordings/' + share.recording_id" class="t-body-strong hover:underline block truncate" dir="auto" v-text="share.recording_title"></a>
                                    <p class="t-meta">${ t('help.sharedOn') }: ${ formatShareDate(share.created_at) }</p>
                                </div>
                                <button @click="confirmDeleteShare(share)" class="btn btn--icon btn--sm" style="color: var(--text-danger);" :title="t('buttons.delete')"><i class="fas fa-trash"></i></button>
                            </div>
                            <div class="mt-3 flex items-center gap-4">
                                <label class="flex items-center text-sm">
                                    <input type="checkbox" v-model="share.share_summary" @change="updateShare(share)" class="h-4 w-4 rounded">
                                    <span class="ml-2" v-text="t('form.shareSummary')"></span>
                                </label>
                                <label class="flex items-center text-sm">
                                    <input type="checkbox" v-model="share.share_notes" @change="updateShare(share)" class="h-4 w-4 rounded">
                                    <span class="ml-2" v-text="t('form.shareNotes')"></span>
                                </label>
                            </div>
                            <div class="mt-3 relative">
                                <input :value="'{{ request.url_root }}share/' + share.public_id" :id="'share-link-' + share.id" readonly class="field pr-12">
                                <button @click="copyIndividualShareLink(share.id)"
                                        class="absolute right-1.5 top-1/2 -translate-y-1/2 btn btn--sm btn--primary btn--icon"
                                        :title="t('buttons.copy')">
                                    <i :class="copiedShareId === share.id ? 'fas fa-check' : 'fas fa-copy'"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

                <section v-if="sharesInternalEnabled">
                    <h4 class="t-label mb-2 flex items-center gap-2"><i class="fas fa-user-friends"></i><span v-text="t('sharedTranscripts.peopleAndGroups')"></span></h4>
                    <p v-if="sharesByMe.length === 0" class="t-meta" v-text="t('sharedTranscripts.noInternalShares')"></p>
                    <div v-else class="space-y-3">
                        <div v-for="entry in sharesByMe" :key="entry.recording_id"
                             class="p-4 rounded-md border border-[var(--border-primary)] bg-[var(--bg-tertiary)]">
                            <a :href="'/recordings/' + entry.recording_id" class="t-body-strong hover:underline block truncate" dir="auto" v-text="entry.recording_title"></a>
                            <ul class="mt-2 divide-y divide-[var(--border-primary)]">
                                <li v-for="person in entry.recipients" :key="person.share_id" class="py-2">
                                  <div class="flex items-center justify-between gap-3">
                                    <div class="min-w-0">
                                        <p class="text-sm font-medium text-[var(--text-primary)] truncate" v-text="person.username"></p>
                                        <p class="t-meta">
                                            <span v-text="person.can_edit ? t('sharedTranscripts.canEdit') : t('sharedTranscripts.canView')"></span><span v-if="person.can_reshare"> · <span v-text="t('sharedTranscripts.canReshare')"></span></span>
                                            <span v-if="person.source.type !== 'manual'"> · <i class="fas fa-users text-[10px]"></i> <span v-text="t(person.source.type === 'group_tag' ? 'sharedTranscripts.viaGroupTag' : 'sharedTranscripts.viaGroupFolder', { name: person.source.name || '' })"></span></span>
                                        </p>
                                    </div>
                                    <div v-if="person.revocable" class="flex items-center gap-2 flex-shrink-0">
                                    <button v-if="person.permissions_editable && !person.permissionDraft" type="button"
                                            @click="startPermissionEdit(person)" class="btn btn--sm btn--ghost"
                                            :aria-label="t('sharing.changePermissionsFor', { name: person.username || '' })">
                                        <i class="fas fa-user-cog" aria-hidden="true"></i>
                                        <span v-text="t('sharing.changePermissions')"></span>
                                    </button>
                                    <button @click="revokeShareFromList(entry, person)"
                                            class="btn btn--sm flex-shrink-0" :class="person.confirming ? 'btn--danger' : 'btn--ghost'"
                                            :title="t('sharedTranscripts.revokeAccess')">
                                        <i class="fas fa-user-times"></i>
                                        <span v-text="person.confirming ? t('sharedTranscripts.confirmRevoke') : t('sharedTranscripts.revoke')"></span>
                                    </button>
                                    </div>
                                    <span v-else class="t-meta flex-shrink-0 text-right max-w-[12rem]" v-text="t('sharedTranscripts.groupShareNote')"></span>
                                  </div>
                                  <!-- Change permissions of this share (D#517) -->
                                  <div v-if="person.permissionDraft" class="mt-2 space-y-1.5" role="group"
                                       :aria-label="t('sharing.changePermissionsFor', { name: person.username || '' })">
                                      <label class="flex items-center gap-2 text-sm text-[var(--text-secondary)]">
                                          <input type="checkbox" v-model="person.permissionDraft.can_edit"
                                                 :disabled="!canGrantPermission(person, entry.grantable, 'can_edit')"
                                                 class="h-4 w-4 rounded disabled:opacity-50 disabled:cursor-not-allowed">
                                          <span v-text="t('unifiedShareModal.allowEditing')"></span>
                                      </label>
                                      <label class="flex items-center gap-2 text-sm text-[var(--text-secondary)]">
                                          <input type="checkbox" v-model="person.permissionDraft.can_reshare"
                                                 :disabled="!canGrantPermission(person, entry.grantable, 'can_reshare')"
                                                 class="h-4 w-4 rounded disabled:opacity-50 disabled:cursor-not-allowed">
                                          <span v-text="t('unifiedShareModal.allowReshare')"></span>
                                      </label>
                                      <div class="flex justify-end gap-2">
                                          <button type="button" class="btn btn--sm btn--ghost" @click="cancelPermissionEdit(person)" v-text="t('common.cancel')"></button>
                                          <button type="button" class="btn btn--sm btn--primary" :disabled="person.savingPermissions"
                                                  @click="savePermissionEdit(person, person.share_id)" v-text="t('common.save')"></button>
                                      </div>
                                  </div>
                                </li>
                            </ul>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Shared with me -->
            <div v-else>
                <div v-if="sharesWithMe.length === 0" class="empty">
                    <div class="empty__icon"><i class="fas fa-inbox"></i></div>
                    <div class="empty__title" v-text="t('sharedTranscripts.nothingSharedWithMe')"></div>
                </div>
                <ul v-else class="space-y-2">
                    <li v-for="item in sharesWithMe" :key="item.share_id"
                        class="p-3 rounded-md border border-[var(--border-primary)] bg-[var(--bg-tertiary)] flex items-center justify-between gap-3">
                        <div class="min-w-0">
                            <a :href="'/recordings/' + item.recording_id" class="t-body-strong hover:underline block truncate" dir="auto" v-text="item.recording_title"></a>
                            <p class="t-meta">
                                <span v-if="item.owner_username" v-text="t('sharedTranscripts.fromOwner', { name: item.owner_username })"></span><span v-if="item.owner_username"> · </span>
                                <span v-text="item.can_edit ? t('sharedTranscripts.canEdit') : t('sharedTranscripts.canView')"></span>
                                <span v-if="item.source.type !== 'manual'"> · <i class="fas fa-users text-[10px]"></i> <span v-text="t(item.source.type === 'group_tag' ? 'sharedTranscripts.viaGroupTag' : 'sharedTranscripts.viaGroupFolder', { name: item.source.name || '' })"></span></span>
                                · ${ formatShareDate(item.created_at) }
                            </p>
                        </div>
                        <a :href="'/recordings/' + item.recording_id" class="btn btn--sm btn--ghost flex-shrink-0">
                            <i class="fas fa-external-link-alt"></i><span v-text="t('sharedTranscripts.open')"></span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
