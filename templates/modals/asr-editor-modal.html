<!-- Segment transcript editor.
     The transcript pane is the asr-editor-pane component
     (templates/components/asr-editor-pane.html, static/js/modules/asr-editor/):
     it renders only the rows in view over an editing model with undo. Above
     it, the asr-editor-timeline component draws the same model on a canvas.
     The player, the find and replace bar and the save buttons stay here. -->
<div v-if="showAsrEditorModal" @click.self="closeAsrEditorModal()" class="modal-overlay" data-shortcut-scope="editor">
    <div class="modal-panel modal-panel--xl modal-panel--phone-full asr-editor-modal">
        <div class="modal-header">
            <h3 class="modal-title" v-text="t('modal.editAsrTranscription')"></h3>
            <span v-if="asrEditorSaveFlash" class="pill-status pill-status--success">
                <i class="fas fa-check-circle"></i>
                <span v-text="t('asrEditor.saved')"></span>
            </span>
            <button @click="closeAsrEditorModal()" class="modal-close ml-auto" :title="t('buttons.close')" :aria-label="t('buttons.close')"><i class="fas fa-times"></i></button>
        </div>

        <!-- Audio Player Section -->
        <div class="asr-editor-player border-b border-[var(--border-primary)] flex-shrink-0">
            <!-- Show message if audio has been deleted -->
            <div v-if="selectedRecording.audio_deleted_at"
                 class="bg-[var(--bg-tertiary)] border border-[var(--border-primary)] text-[var(--text-secondary)] px-4 py-3 rounded-lg flex items-center gap-2 text-sm">
                <i class="fas fa-info-circle"></i>
                <span v-text="t('help.audioDeletedMessage')"></span>
            </div>
            <!-- Show message for incognito recordings -->
            <div v-else-if="selectedRecording.incognito"
                 class="bg-[var(--bg-tertiary)] border border-[var(--border-primary)] text-[var(--text-secondary)] px-4 py-3 rounded-lg flex items-center gap-2 text-sm">
                <i class="fas fa-user-secret"></i>
                <span v-text="t('incognito.audioNotStored')"></span>
            </div>
            <!-- Custom Audio Player (Independent from main player) -->
            <div v-else class="flex items-center gap-3">
                <audio ref="asrEditorAudioRef" class="hidden" data-asr-editor-audio
                       :key="'asr-editor-' + selectedRecording.id"
                       :src="'/audio/' + selectedRecording.id"
                       :volume="playerVolume"
                       @play="handleModalAudioPlayPause"
                       @pause="handleModalAudioPlayPause"
                       @timeupdate="handleModalAudioTimeUpdate"
                       @loadedmetadata="handleModalAudioLoadedMetadata"
                       @ended="modalAudioIsPlaying = false">
                </audio>
                <!-- Play/Pause -->
                <button @click="$refs.asrEditorAudioRef?.paused ? $refs.asrEditorAudioRef.play() : $refs.asrEditorAudioRef.pause()"
                        class="w-10 h-10 flex items-center justify-center rounded-full bg-[var(--bg-accent)] hover:bg-[var(--bg-accent-hover)] text-white transition-all flex-shrink-0 shadow-sm"
                        :title="modalAudioIsPlaying ? t('tooltips.pause') : t('tooltips.play')">
                    <i :class="modalAudioIsPlaying ? 'fas fa-pause' : 'fas fa-play'" class="text-sm" :style="!modalAudioIsPlaying ? 'margin-left: 2px' : ''"></i>
                </button>
                <!-- Time -->
                <div class="flex flex-col items-end flex-shrink-0 leading-none">
                    <span class="text-sm text-[var(--text-primary)] font-mono">${ formatAudioTime(modalAudioCurrentTime) }</span>
                    <span class="text-xs text-[var(--text-muted)] font-mono">${ formatAudioTime(modalAudioDuration) }</span>
                </div>
                <!-- Progress Bar -->
                <div class="flex-1 h-2 bg-[var(--bg-tertiary)] rounded-full cursor-pointer group relative"
                     @click="(e) => { const rect = e.currentTarget.getBoundingClientRect(); const pct = (e.clientX - rect.left) / rect.width; if ($refs.asrEditorAudioRef) $refs.asrEditorAudioRef.currentTime = pct * modalAudioDuration; }">
                    <div class="h-full bg-[var(--bg-accent)] rounded-full transition-all duration-100"
                         :style="{ width: modalAudioProgressPercent + '%' }">
                    </div>
                </div>
                <!-- Volume -->
                <div class="flex items-center gap-2 flex-shrink-0">
                    <button @click="$refs.asrEditorAudioRef && ($refs.asrEditorAudioRef.muted = !$refs.asrEditorAudioRef.muted)"
                            class="w-8 h-8 flex items-center justify-center rounded hover:bg-[var(--bg-tertiary)] text-[var(--text-muted)] hover:text-[var(--text-primary)] transition-all"
                            :title="t('tooltips.mute')" :aria-label="t('tooltips.mute')">
                        <i :class="playerVolume === 0 ? 'fas fa-volume-mute' : 'fas fa-volume-up'" class="text-sm"></i>
                    </button>
                    <input type="range" min="0" max="1" step="0.05" :value="playerVolume"
                           @input="(e) => { if ($refs.asrEditorAudioRef) $refs.asrEditorAudioRef.volume = parseFloat(e.target.value); }"
                           :aria-label="t('asrEditor.volume')"
                           class="volume-slider w-20 h-1.5 rounded-full cursor-pointer">
                </div>
                <!-- Speed Control (compact - tap to cycle) -->
                <button @click="cycleModalPlaybackRate(); if ($refs.asrEditorAudioRef) $refs.asrEditorAudioRef.playbackRate = modalPlaybackRate"
                        class="w-8 h-8 flex items-center justify-center rounded hover:bg-[var(--bg-tertiary)] text-[var(--text-muted)] hover:text-[var(--text-primary)] transition-all flex-shrink-0"
                        :title="t('tooltips.playbackSpeedTapToChange')"
                        :aria-label="t('tooltips.playbackSpeed') + ': ' + formatPlaybackRate(modalPlaybackRate)">
                    <span class="text-xs font-semibold font-mono">${ formatPlaybackRate(modalPlaybackRate) }</span>
                </button>
            </div>
        </div>

        <!-- Timeline: waveform and one lane per speaker (static/js/modules/asr-editor/timeline.js) -->
        <asr-editor-timeline v-if="asrEditorSession" :key="'timeline-' + asrEditorSession.key" :session="asrEditorSession"
                             :duration="Number(selectedRecording.audio_duration_seconds) || 0"
                             :has-audio="!selectedRecording.audio_deleted_at && !selectedRecording.incognito"
                             :can-trim="canTrimRecording(asrEditorSession)"
                             :has-summary="!!selectedRecording.summary"
                             :stored-duration="Number(selectedRecording.audio_duration) || 0"></asr-editor-timeline>

        {% include 'components/find-replace-bar.html' %}

        <asr-editor-pane v-if="asrEditorSession" :key="asrEditorSession.key" :session="asrEditorSession"
                         :find-open="findReplace.open"
                         @toggle-find="findReplace.open ? closeFindReplace() : openFindReplace()"></asr-editor-pane>

        <div class="asr-editor-footer">
            <span v-if="asrEditorDirty" class="asr-editor-footer__status" data-asr-dirty>
                <i class="fas fa-circle text-[6px]" aria-hidden="true"></i>
                <span v-text="t('asrEditor.unsaved')"></span>
            </span>
            <span v-else class="asr-editor-footer__status asr-editor-footer__status--hint">
                <i class="fas fa-keyboard text-[10px]" aria-hidden="true"></i>
                <span v-text="t('asrEditor.ctrlSHint')"></span>
            </span>
            <!-- The checkbox of the Identify Speakers dialog, with its server route
                 (regenerate_summary on update_transcript) and its own wording: an
                 edit here is not only about names. Not for a translation or an
                 incognito recording, which that route does not store. -->
            <label v-if="asrEditorSession && canRegenerateSummary(asrEditorSession)" class="asr-editor-footer__summary" data-asr-regenerate-summary>
                <input type="checkbox" v-model="asrEditorRegenerateSummary">
                <span v-text="t('asrEditor.updateSummary')"></span>
            </label>
            <div class="asr-editor-footer__actions">
                <button @click="closeAsrEditorModal()" class="btn btn--ghost" v-text="t('common.cancel')"></button>
                <button @click="saveAsrTranscription(true)" class="btn btn--ghost" data-asr-action="save" :disabled="asrEditorSaving" :title="t('asrEditor.saveWithoutClosing')">
                    <i class="fas fa-save text-xs"></i>
                    <span v-text="t('common.save')"></span>
                </button>
                <button @click="saveAsrTranscription(false)" class="btn btn--primary" data-asr-action="save-close" :disabled="asrEditorSaving" v-text="t('asrEditor.saveAndClose')"></button>
            </div>
        </div>
    </div>
</div>
