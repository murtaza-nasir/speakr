<!-- Shared speaker/transcript list and tools for one selected draft segment. -->
<div v-if="showAsrEditorModal" @click.self="closeAsrEditorModal" class="modal-overlay" data-testid="asr-editor">
 <div class="modal-panel modal-panel--xl sw-workplace spk-modal tw-workspace">
  <div class="sw-content" :inert="asrCloseDecision || !!asrDeleteCandidate">
  <header class="modal-header">
   <h3 class="modal-title" v-text="t('transcriptWorkspace.title')"></h3>
   <button data-testid="asr-editor-close" @click="closeAsrEditorModal" class="modal-close" :aria-label="t('buttons.close')"><i class="fas fa-times"></i></button>
  </header>
  <div v-if="modalSpeakers.length > 16" class="banner banner--warn"><i class="fas fa-exclamation-triangle"></i><span v-text="t('help.moreSpeakersThanColors')"></span><span v-text="t('help.youHaveXSpeakers', {count:modalSpeakers.length})"></span></div>
  <div class="sw-transport">
   <template v-if="asrCanPlay">
    <component :is="selectedRecording.mime_type?.startsWith('video/') ? 'video' : 'audio'" ref="asrEditorAudioRef" :class="selectedRecording.mime_type?.startsWith('video/') ? (speakerModalVideoCollapsed ? 'tw-video tw-video-collapsed' : 'tw-video') : 'hidden'" :key="'asr-editor-'+selectedRecording.id" :src="'/audio/'+selectedRecording.id"
      @play="handleModalAudioPlayPause" @pause="handleModalAudioPlayPause"
      @timeupdate="handleModalAudioTimeUpdate($event); handleAsrWorkplaceTimeUpdate($event); onModalTimeUpdate($event)"
      @loadedmetadata="handleModalAudioLoadedMetadata($event); handleAsrWorkplaceMetadata($event)" @ended="modalAudioIsPlaying=false"></component>
    <button type="button" data-testid="asr-play" class="btn btn--primary" @click="playAsrWorkplace" :aria-label="modalAudioIsPlaying ? t('asrWorkplace.pause') : t('asrWorkplace.play')"><i :class="modalAudioIsPlaying ? 'fas fa-pause' : 'fas fa-play'"></i></button>
    <label class="sw-playmode"><span class="sr-only" v-text="t('asrWorkplace.playMode')"></span><select data-testid="asr-play-mode" :value="asrPlaybackMode" @change="setAsrPlaybackMode($event.target.value)">
     <option value="segment" v-text="t('asrWorkplace.onlySegment')"></option><option value="marker" :disabled="!asrCanPlayMarker" v-text="t(asrCanPlayMarker ? 'asrWorkplace.fromMarker' : 'asrWorkplace.markerRequired')"></option>
     <option value="fromHere" v-text="t('asrWorkplace.fromHere')"></option><option value="recording" v-text="t('asrWorkplace.wholeRecording')"></option>
    </select></label>
    <span class="sw-playtime">${ formatAudioTime(modalAudioCurrentTime) } / ${ formatAudioTime(asrDuration || 0) }</span>
    <input data-testid="asr-seek" class="sw-seek" type="range" min="0" :max="asrDuration || 0" step="0.01" :value="modalAudioCurrentTime" @input="seekAsrWorkplace" :aria-label="t('asrWorkplace.seek')" />
    <button class="btn btn--ghost" @click="toggleAsrMute" :aria-label="t('asrWorkplace.mute')" :aria-pressed="asrMuted"><i :class="asrMuted || asrVolume===0 ? 'fas fa-volume-mute' : 'fas fa-volume-up'"></i></button>
    <input class="sw-volume" type="range" min="0" max="1" step="0.05" :value="asrVolume" @input="setAsrVolume" :aria-label="t('asrWorkplace.volume')" />
    <select data-testid="asr-speed" :value="modalPlaybackRate" @change="modalPlaybackRate=Number($event.target.value); $refs.asrEditorAudioRef.playbackRate=modalPlaybackRate" :aria-label="t('asrWorkplace.speed')"><option v-for="speed in playbackSpeeds" :key="speed" :value="speed">${ speed }×</option></select>
    <button v-if="selectedRecording.mime_type?.startsWith('video/')" @click="toggleSpeakerModalVideo" class="btn btn--ghost" :aria-label="t(speakerModalVideoCollapsed ? 'speakerModal.showVideo' : 'speakerModal.hideVideo')"><i class="fas fa-video"></i></button>
   </template>
   <p v-else class="sw-note" v-text="t(selectedRecording.incognito ? 'asrWorkplace.incognitoAudio' : 'asrWorkplace.audioUnavailable')"></p>
  </div>
  <nav class="tw-tabs" role="tablist"><button v-if="workspaceMode==='speakers'" @click="workspacePhonePane='speakers'" :aria-selected="workspacePhonePane==='speakers'" role="tab" v-text="t('speakerModal.speakersTab')"></button><button @click="workspacePhonePane='transcript'" :aria-selected="workspacePhonePane==='transcript'" role="tab" v-text="t('speakerModal.transcriptTab')"></button><button v-if="workspaceMode==='editor'" @click="workspacePhonePane='editor'" :aria-selected="workspacePhonePane==='editor'" role="tab" v-text="t('transcriptWorkspace.editor')"></button></nav>
<div class="sw-body tw-layout" :class="{'tw-edit-mode':workspaceMode==='editor'}">
{% include 'modals/workspace-speaker-pane.html' %}
{% include 'modals/workspace-transcript-pane.html' %}
<main v-show="workspaceMode==='editor'" data-testid="workspace-editor" class="sw-detail tw-editor custom-scrollbar" :class="{'tw-phone-hide':workspacePhonePane!=='editor'}">
    <template v-if="asrSelectedSegment">
     <div class="sw-detail-heading"><button data-testid="workspace-back" @click="backToWorkspaceSpeakers" class="btn btn--ghost btn--sm" v-text="t('transcriptWorkspace.back')"></button><strong>${ t('asrWorkplace.segment') } ${ asrSelectedIndex+1 } / ${ editingSegments.length }</strong><div class="sw-nav"><button @click="navigateWorkspaceSegment(-1)" :disabled="!canNavigateWorkspaceSegment(-1) || asrCloseDecision" :aria-label="t('asrWorkplace.previous')" class="btn btn--ghost">←</button><button @click="navigateWorkspaceSegment(1)" :disabled="!canNavigateWorkspaceSegment(1) || asrCloseDecision" :aria-label="t('asrWorkplace.next')" class="btn btn--ghost">→</button></div></div>
     <fieldset class="sw-fields" :disabled="asrEditingLocked" data-testid="asr-detail" :data-segment-index="asrSelectedIndex">
      <div class="sw-meta">
       <label class="sw-speaker-field"><span v-text="t('help.speakerName')"></span><div class="sw-speaker-input"><asr-speaker-input :key="asrSegmentKey(asrSelectedIndex)" data-testid="asr-segment-speaker" :model-value="workspaceSpeakerName(asrSelectedSegment.speaker)" @update:model-value="editAsrSpeaker(asrSelectedIndex,$event)" :options="asrSpeakerOptions" :disabled="asrEditingLocked" :label="t('help.speakerName')"></asr-speaker-input><button type="button" @click="openEditSpeakersModal" :title="t('asrWorkplace.speakers')" :aria-label="t('asrWorkplace.speakers')" class="btn btn--ghost"><i class="fas fa-users"></i></button></div></label>
       <label><span v-text="t('help.startTime')"></span><input data-testid="asr-start" type="number" min="0" step="0.01" v-model.number="asrSelectedSegment.start_time" />
        <button type="button" class="sw-boundary" data-testid="asr-extend-start" @click="extendAsrBoundary('start_time')" :disabled="!!asrBoundaryExtension('start_time').error" :title="t('asrWorkplace.'+(asrBoundaryExtension('start_time').error || 'extendStart'))" v-text="t('asrWorkplace.extendStart')"></button>
       </label>
       <label><span v-text="t('help.endTime')"></span><input data-testid="asr-end" type="number" min="0" step="0.01" v-model.number="asrSelectedSegment.end_time" />
        <button type="button" class="sw-boundary" data-testid="asr-extend-end" @click="extendAsrBoundary('end_time')" :disabled="!!asrBoundaryExtension('end_time').error" :title="t('asrWorkplace.'+(asrBoundaryExtension('end_time').error || 'extendEnd'))" v-text="t(asrSelectedIndex===editingSegments.length-1 ? 'asrWorkplace.extendToRecordingEnd' : 'asrWorkplace.extendEnd')"></button>
       </label>
      </div>
      <label class="sw-text-label"><span v-text="t('help.sentence')"></span><textarea dir="auto" data-testid="asr-segment-text" v-model="asrSelectedSegment.sentence" rows="5" :readonly="segmentTranscription?.status==='done'"
       @click="captureSplitSelection(asrSelectedIndex,$event)" @select="captureSplitSelection(asrSelectedIndex,$event)" @keyup="captureSplitSelection(asrSelectedIndex,$event)" @input="captureSplitSelection(asrSelectedIndex,$event); autoResizeTextarea($event)" @keydown="handleSplitKeydown(asrSelectedIndex,$event)"></textarea></label>
     </fieldset>
      <div class="sw-main-actions">
       <button data-testid="asr-split-segment" @mousedown.prevent @click="splitSegmentAtCursor(asrSelectedIndex)" :disabled="asrEditingLocked || !canSplitSegment(asrSelectedIndex)" :title="splitSegmentTitle(asrSelectedIndex)" class="btn btn--primary"><i class="fas fa-scissors"></i><span v-text="t('asrWorkplace.split')"></span></button>
       <button data-testid="asr-show-spectrogram" @mousedown.prevent @click="spectrogram ? closeSpectrogram(true,false) : openSpectrogram(asrSelectedIndex)" :disabled="!canShowSpectrogram(asrSelectedIndex)" :title="t('asrSpectrogram.title')" class="btn btn--ghost"><i class="fas fa-wave-square"></i><span v-text="t('asrSpectrogram.title')"></span></button>
       <button data-testid="asr-retranscribe" @click="retranscribeSegment(asrSelectedIndex)" :disabled="asrEditingLocked || !canTranscribeSegment(asrSelectedIndex)" :title="t(asrSelectedSegment.end_time-asrSelectedSegment.start_time>300 ? 'asrSegment.error_bounds' : 'asrSegment.title')" class="btn btn--ghost"><i class="fas fa-redo"></i><span v-text="t('asrSegment.title')"></span></button>
       <details class="sw-more"><summary v-text="t('asrWorkplace.more')"></summary><div><button @click="addSegmentBelow(asrSelectedIndex)" :disabled="asrEditingLocked" class="btn btn--ghost" v-text="t('help.addSegmentBelow')"></button><button @click="requestAsrDelete(asrSelectedIndex)" :disabled="asrEditingLocked" class="btn btn--ghost" v-text="t('help.deleteSegment')"></button></div></details>
      </div>
     <p class="sw-note" data-testid="asr-split-hint" v-text="t(spectrogram && spectrogram.marker!==null ? 'asrSpectrogram.splitHint' : 'asrEditor.splitHint')"></p>
     <section v-if="asrSplitPreview" data-testid="asr-split-preview" class="sw-preview">
      <strong v-text="t('asrWorkplace.splitPreview')"></strong><p class="sw-note" v-text="t(asrSplitPreview.exact ? 'asrWorkplace.exactBoundary' : 'asrWorkplace.approximateBoundary')"></p>
      <div class="sw-preview-parts"><article v-for="(part,i) in asrSplitPreview.parts" :key="i"><small>${ part.start_time.toFixed(2) }–${ part.end_time.toFixed(2) }</small><label><span v-text="t('help.speakerName')"></span><asr-speaker-input :data-testid="'asr-split-speaker-'+i" v-model="part.speaker" :options="asrSpeakerOptions" :disabled="asrEditingLocked" :label="t('help.speakerName')"></asr-speaker-input></label><p v-text="part.sentence"></p></article></div>
      <button data-testid="asr-confirm-split" @click="confirmAsrSplit" :disabled="asrEditingLocked" class="btn btn--primary" v-text="t('asrWorkplace.confirmSplit')"></button><button @click="cancelAsrSplit" class="btn btn--ghost" v-text="t('buttons.cancel')"></button>
     </section>
        <section v-if="spectrogram" data-testid="asr-spectrogram-panel" class="sw-tools sw-spectrum-panel py-2 border-b border-[var(--border-primary)] flex-shrink-0 text-xs text-[var(--text-secondary)]">
            <div class="flex items-center justify-between gap-2 mb-1">
                <strong><span v-text="t('asrSpectrogram.title')"></span> · ${ spectrogram.speaker } · ${ spectrogram.segmentStart.toFixed(2) }–${ spectrogram.segmentEnd.toFixed(2) } s</strong>
                <button type="button" @mousedown.prevent @click="closeSpectrogram(true,false)" :aria-label="t('buttons.close')" class="p-1 rounded hover:bg-[var(--bg-tertiary)]"><i class="fas fa-times"></i></button>
            </div>
            <div v-if="spectrogram.loading" class="py-2 flex items-center gap-2" role="status" data-testid="asr-spectrogram-status"><i class="fas fa-spinner fa-spin"></i><span v-text="t(spectrogram.url ? 'asrSpectrogram.preparing' : 'asrSpectrogram.loading')"></span><button type="button" @click="cancelSpectrogramPreparation" class="btn btn--ghost" v-text="t('buttons.cancel')"></button></div>
            <div v-if="spectrogram.error" class="py-3" role="alert" data-testid="asr-spectrogram-error">
                <span v-text="t('asrSpectrogram.error_' + spectrogram.error)"></span>
                <button type="button" @click="retrySpectrogram" class="btn btn--ghost ml-2" v-text="t('common.retry')"></button>
            </div>
            <div class="flex gap-1">
                <div data-testid="asr-spectrogram-axis" :style="{height:spectrogramStripStyle().height}" class="sw-spectrum-axis flex flex-col justify-between font-mono text-[var(--text-muted)] flex-shrink-0">
                    <label class="sw-spectrum-frequency" :title="t('asrSpectrogram.frequency') + ': ' + (spectrogram.frequency === 'full' ? t('asrSpectrogram.fullFrequency') : '0–' + Number(spectrogram.frequency)/1000 + ' kHz')">
                        <span id="asr-spectrogram-upper-frequency" data-testid="asr-spectrogram-upper-frequency" v-text="spectrogramFrequencyLabel()"></span><i aria-hidden="true" class="fas fa-chevron-down"></i>
                        <select data-testid="asr-spectrogram-frequency" :aria-label="t('asrSpectrogram.frequency')" aria-describedby="asr-spectrogram-upper-frequency" :value="spectrogram.frequency" @change="setSpectrogramFrequency($event.target.value)">
                            <option value="2000">0–2 kHz</option><option value="4000">0–4 kHz</option><option value="8000">0–8 kHz</option>
                            <option value="full" v-text="t('asrSpectrogram.fullFrequency')"></option>
                        </select>
                    </label>
                    <span v-if="spectrogram.channels === 2">0 / ${ Number((spectrogram.maxFrequency / 1000).toFixed(2)) }</span><span>0 kHz</span>
                </div>
                <div class="flex-1 min-w-0">
                    <div :data-testid="spectrogram.url ? 'asr-spectrogram-plot' : 'asr-spectrogram-loading-plot'" role="slider" :tabindex="spectrogram.url ? 0 : -1"
                         :aria-label="t('asrSpectrogram.marker')" aria-describedby="asr-spectrogram-upper-frequency" :aria-valuemin="spectrogram.segmentStart" :aria-valuemax="spectrogram.segmentEnd"
                         :aria-valuenow="Number.isFinite(spectrogram.marker) ? spectrogram.marker : undefined"
                         @click="clickSpectrogram"
                         @keydown.left.prevent="adjustSpectrogramMarker(-0.01)" @keydown.right.prevent="adjustSpectrogramMarker(0.01)"
                         class="relative h-28 sm:h-40 bg-black cursor-crosshair overflow-hidden rounded">
                        <div :ref="spectrogramViewportRef" data-testid="asr-spectrogram-scroll" class="sw-spectrum-scroll" @scroll="spectrogramScroll">
                            <div class="sw-spectrum-strip" :style="spectrogramStripStyle()">
                                <img v-for="tile in spectrogramTiles()" :key="tile.index" :src="tile.url" :alt="t('asrSpectrogram.title')" draggable="false" class="sw-spectrum-tile" :style="{left:tile.left+'px',width:tile.width+'px',height:'100%'}" />
                            </div>
                        </div>
                        <span v-if="spectrogram.channels === 2" class="absolute left-1 top-0 text-white font-mono pointer-events-none">L</span>
                        <span v-if="spectrogram.channels === 2" class="absolute left-1 text-white font-mono pointer-events-none" :style="{top:parseFloat(spectrogramStripStyle().height)/2+'px'}">R</span>
                        <div class="absolute inset-y-0 left-0 bg-black/50 pointer-events-none" :style="{width:spectrogramContextPercent('left')+'%'}"></div>
                        <div class="absolute inset-y-0 right-0 bg-black/50 pointer-events-none" :style="{width:spectrogramContextPercent('right')+'%'}"></div>
                        <div v-if="spectrogramPlayheadPercent() !== null" class="absolute inset-y-0 border-l border-white pointer-events-none" :style="{left:spectrogramPlayheadPercent()+'%'}"></div>
                        <div v-if="spectrogramMarkerPercent() !== null" data-testid="asr-spectrogram-marker" class="absolute inset-y-0 border-l-2 border-cyan-300 pointer-events-none" :style="{left:spectrogramMarkerPercent()+'%'}"></div>
                    </div>
                    <div class="flex justify-between font-mono text-[var(--text-muted)] mt-0.5" data-testid="asr-spectrogram-window"><span>${ spectrogram.window.start.toFixed(2) } s</span><span>${ spectrogram.window.end.toFixed(2) } s</span></div>
                </div>
            </div>
            <div class="sw-spectrum-brightness" data-testid="asr-spectrogram-brightness-controls" @click.stop @keydown.stop>
                <label for="asr-spectrum-gain" v-text="t('asrSpectrogram.brightness')" :title="t('asrSpectrogram.brightnessHint')"></label>
                <input id="asr-spectrum-gain" data-testid="asr-spectrogram-gain" type="range" min="0" max="40" step="5"
                       :value="spectrogram.draftGainDb" :aria-label="t('asrSpectrogram.brightness')"
                       :aria-valuetext="'+' + spectrogram.draftGainDb + ' ' + t('asrSpectrogram.decibels')"
                       :title="t('asrSpectrogram.brightnessHint')" @pointerdown="beginSpectrogramGainPointer" @pointercancel="cancelSpectrogramGainDraft"
                       @keydown="spectrogram.gainKeyboard=true" @input="draftSpectrogramGain($event.target.value)"
                       @change="spectrogram.gainKeyboard ? queueSpectrogramGain() : commitSpectrogramGain()" />
                <output data-testid="asr-spectrogram-gain-value" for="asr-spectrum-gain">+${ spectrogram.draftGainDb } ${ t('asrSpectrogram.decibels') }</output>
                <button data-testid="asr-spectrogram-gain-reset" type="button" class="btn btn--ghost" @click="resetSpectrogramGain"
                        :disabled="spectrogram.draftGainDb===0 && spectrogram.gainDb===0" v-text="t('asrSpectrogram.resetBrightness')"></button>
            </div>
            <p v-if="spectrogram.url && spectrogram.appliedGainDb !== spectrogram.draftGainDb" data-testid="asr-spectrogram-applied-gain" role="status" class="sw-note">
                <span v-if="spectrogram.loading" v-text="t('asrSpectrogram.updatingBrightness')"></span>
                <span v-text="t('asrSpectrogram.displayedBrightness')"></span> +${ spectrogram.appliedGainDb } ${ t('asrSpectrogram.decibels') }
            </p>
            <div class="flex flex-wrap items-center gap-1 mt-1">
                <button type="button" data-testid="asr-spectrogram-zoom-out" @click="navigateSpectrogram(2)" :disabled="!canZoomSpectrogram(2)" :title="t('asrSpectrogram.zoomOut')" :aria-label="t('asrSpectrogram.zoomOut')" class="btn btn--ghost px-2 py-1">−</button>
                <button type="button" data-testid="asr-spectrogram-zoom-in" @click="navigateSpectrogram(0.5)" :disabled="!canZoomSpectrogram(0.5)" :title="t('asrSpectrogram.zoomIn')" :aria-label="t('asrSpectrogram.zoomIn')" class="btn btn--ghost px-2 py-1">+</button>
                <button type="button" data-testid="asr-spectrogram-fit" @click="fitSpectrogram" :disabled="!canFitSpectrogram()" :title="t('asrSpectrogram.fit')" :aria-label="t('asrSpectrogram.fit')" class="btn btn--ghost px-2 py-1" v-text="t('asrSpectrogram.fit')"></button>
                <button type="button" data-testid="asr-spectrogram-previous" @click="navigateSpectrogram(1,-1)" :disabled="!spectrogram.url || spectrogram.error==='expired'" :title="t('asrSpectrogram.previous')" class="btn btn--ghost px-2 py-1">←</button>
                <button type="button" data-testid="asr-spectrogram-next" @click="navigateSpectrogram(1,1)" :disabled="!spectrogram.url || spectrogram.error==='expired'" :title="t('asrSpectrogram.next')" class="btn btn--ghost px-2 py-1">→</button>
                <button type="button" data-testid="asr-spectrogram-play" @click="playAsrSpectrum(false)" :disabled="!asrSpectrumPlaying(false) && (!spectrogram.url || !asrCanPlay)" :aria-label="t(asrSpectrumAction(false))" class="btn btn--ghost px-2 py-1"><i :class="asrSpectrumPlaying(false) ? 'fas fa-pause mr-1' : 'fas fa-play mr-1'"></i><span v-text="t(asrSpectrumAction(false))"></span></button>
                <button type="button" data-testid="asr-spectrogram-play-marker" @click="playAsrSpectrum(true)" :disabled="!asrSpectrumPlaying(true) && (!spectrogram.url || !asrCanPlayMarker || !asrCanPlay)" :aria-label="t(asrSpectrumAction(true))" class="btn btn--ghost px-2 py-1"><i :class="asrSpectrumPlaying(true) ? 'fas fa-pause mr-1' : 'fas fa-play mr-1'"></i><span v-text="t(asrSpectrumAction(true))"></span></button>
                <label class="inline-flex items-center gap-1"><span v-text="t('asrSpectrogram.marker')"></span>
                    <input type="number" step="0.01" data-testid="asr-spectrogram-time" :value="Number.isFinite(spectrogram.marker) ? spectrogram.marker : ''" @input="setSpectrogramMarker($event.target.value)" class="w-24 p-1 rounded bg-[var(--bg-input)] border border-[var(--border-primary)]" />
                </label>
                <button type="button" @click="resetSpectrogramMarker" class="btn btn--ghost px-2 py-1" v-text="t('asrSpectrogram.reset')"></button>
            </div>
            <p v-if="spectrogram.markerError" role="alert" v-text="t('asrSpectrogram.invalidMarker')"></p>
            <p v-else-if="spectrogram.marker !== null && spectrogramMarkerPercent() === null" v-text="t('asrSpectrogram.offscreen')"></p>
        </section>
        <section v-if="segmentTranscription" data-testid="asr-retranscription-panel" class="sw-tools py-2 border-b border-[var(--border-primary)] text-xs text-[var(--text-secondary)]">
            <div class="flex items-center justify-between gap-2 mb-1"><strong><span v-text="t('asrSegment.title')"></span> · ${ segmentTranscription.speaker } · ${ segmentTranscription.start.toFixed(2) }–${ segmentTranscription.end.toFixed(2) } s</strong>
                <button type="button" @click="closeSegmentTranscription(true)" :aria-label="t('buttons.close')" class="p-1"><i class="fas fa-times"></i></button></div>
            <div v-if="segmentTranscription.status === 'running'" role="status" class="py-2"><i class="fas fa-spinner fa-spin mr-2"></i><span v-text="t('asrSegment.running')"></span>
                <button type="button" @click="closeSegmentTranscription(true)" class="btn btn--ghost ml-2" v-text="t('buttons.cancel')"></button></div>
            <div v-else-if="segmentTranscription.status === 'failed'" role="alert" data-testid="asr-retranscription-error" class="py-2">
                <span v-text="t('asrSegment.error_' + segmentTranscription.error)"></span>
                <button type="button" @click="retrySegmentTranscription" class="btn btn--ghost ml-2" v-text="t('common.retry')"></button></div>
            <div v-else-if="segmentTranscription.status === 'done'">
                <strong v-text="t('asrSegment.original')"></strong><p class="max-h-12 overflow-y-auto whitespace-pre-wrap mb-1" v-text="segmentTranscription.original"></p>
                <label><span v-text="t('asrSegment.proposal')"></span><textarea dir="auto" data-testid="asr-retranscription-proposal" v-model="segmentTranscription.proposal" :disabled="asrEditingLocked" rows="3" class="block w-full px-2 py-1 mt-1 rounded border border-[var(--border-primary)] bg-[var(--bg-secondary)] text-[var(--text-primary)] resize-y max-h-32"></textarea></label>
                <div class="flex flex-wrap gap-1 mt-1"><button type="button" data-testid="asr-retranscription-apply" @click="applySegmentTranscription" :disabled="!canApplySegmentTranscription()" class="btn btn--primary disabled:opacity-40" v-text="t('asrSegment.apply')"></button>
                    <button type="button" @click="closeSegmentTranscription(true)" class="btn btn--ghost" v-text="t('buttons.cancel')"></button></div>
            </div>
        </section>
    </template>
    <div v-else class="sw-empty"><p v-text="t('asrWorkplace.empty')"></p><button @click="addSegment" :disabled="asrEditingLocked" class="btn btn--primary" v-text="t('buttons.addSegment')"></button></div>
   </main>
  </div>
  <div class="tw-options"><label><input type="checkbox" v-model="regenerateSummaryAfterSpeakerUpdate" :disabled="!asrCanEdit || selectedRecording.incognito"><span v-text="t('help.regenerateSummaryAfterNames')"></span></label>{% include 'modals/workspace-speaker-actions.html' %}</div><footer class="sw-footer">
   <span role="status" aria-live="polite" data-testid="asr-save-status" :class="{'sw-error':asrSaveState==='error'}" v-text="t('asrWorkplace.status_'+asrSaveState)"></span>
   <span role="status" class="sw-error" v-if="Object.values(workspaceFollowUp).includes('failed')" v-text="t('transcriptWorkspace.followUpFailed')"></span>
   <span role="status" class="sw-error" v-else-if="Object.values(workspaceFollowUp).includes('unknown')" v-text="t('transcriptWorkspace.followUpUnknown')"></span>
   <button v-if="workspaceFollowUp.summary==='failed'" data-testid="workspace-retry-summary" @click="retryWorkspaceSummary" :disabled="!asrCanEdit || asrDirty || workspaceRetryingSummary || selectedRecording.incognito" class="btn btn--ghost" v-text="t('transcriptWorkspace.retrySummary')"></button>
   <span class="sw-autosave" v-if="editorAutosave" v-text="t('asrWorkplace.autosave')"></span>
   <button @click="closeAsrEditorModal" class="btn btn--ghost" v-text="t('buttons.close')"></button>
   <div class="sw-save-group"><button data-testid="asr-save" @click="saveAsrTranscription(true)" :disabled="!asrCanEdit || asrSaveState==='saving' || asrCloseDecision" class="btn btn--primary" v-text="t('common.save')"></button><details><summary :aria-label="t('asrWorkplace.saveOptions')">▾</summary><button data-testid="asr-save-close" @click="saveAsrTranscription(false)" :disabled="!asrCanEdit || asrSaveState==='saving'" class="btn btn--primary" v-text="t('asrWorkplace.saveClose')"></button></details></div>
  </footer>
  </div>
  <div v-if="asrCloseDecision" @keydown="handleAsrDecisionKeydown" class="sw-close-shade" data-testid="asr-close-decision" role="alertdialog" aria-modal="true" :aria-label="t('asrWorkplace.unsaved')">
   <div class="sw-close-box"><strong v-text="t('asrWorkplace.unsaved')"></strong><p v-text="t('asrWorkplace.closeHint')"></p>
    <button data-testid="asr-keep-editing" @click="keepAsrEditing" class="btn btn--ghost" v-text="t('asrWorkplace.keepEditing')"></button>
    <button data-testid="asr-discard" @click="discardAsrDraft" :disabled="asrSaveState==='saving'" class="btn btn--ghost" v-text="t('asrWorkplace.discard')"></button>
    <button @click="saveAsrTranscription(false)" :disabled="!asrCanEdit || asrSaveState==='saving'" class="btn btn--primary" v-text="t('asrWorkplace.saveClose')"></button>
   </div>
  </div>
  <div v-if="asrDeleteCandidate" @keydown="handleAsrDecisionKeydown" class="sw-close-shade" data-testid="asr-delete-decision" role="alertdialog" aria-modal="true" :aria-label="t('help.deleteSegment')">
   <div class="sw-close-box"><strong v-text="t('help.deleteSegment')"></strong><p v-text="t('asrWorkplace.deleteHint')"></p><p v-text="asrDeleteCandidate.sentence" class="sw-list-preview"></p>
    <button data-testid="asr-delete-cancel" @click="cancelAsrDelete" class="btn btn--ghost" v-text="t('buttons.cancel')"></button>
    <button data-testid="asr-delete-confirm" @click="confirmAsrDelete" class="btn btn--primary" v-text="t('help.deleteSegment')"></button>
   </div>
  </div>
 </div>
</div>
