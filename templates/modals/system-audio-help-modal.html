<!-- System Audio Setup Guide.

     Per-OS instructions. The active tab is pre-selected to the user's
     detected platform (helpModalOsTab) when the modal opens, but the
     user can switch to read the others. The capability matrix at the
     top is sourced from the detectPlatform() / getAudioCapabilities()
     helpers in static/js/modules/utils/platform.js. -->
<div v-if="showSystemAudioHelp" @click.self="showSystemAudioHelp = false" class="modal-overlay">
    <div class="modal-panel modal-panel--lg">
        <div class="modal-header">
            <i class="fas fa-desktop text-2xl" style="color: var(--text-accent);"></i>
            <h3 class="modal-title" v-text="t('systemAudioHelp.title')"></h3>
            <button @click="showSystemAudioHelp = false" class="modal-close" :title="t('buttons.close')"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">

            <!-- Capability summary banner. The help texts are translated
                 strings with inline markup, rendered with v-html. -->
            <div class="banner" :class="audioCaps.supportsSystemAudio ? 'banner--success' : 'banner--warn'" style="display: flex; align-items: flex-start; gap: var(--sp-2); margin-bottom: var(--sp-4);">
                <i :class="['fas', audioCaps.supportsSystemAudio ? 'fa-check-circle' : 'fa-info-circle']" style="margin-top: 2px;"></i>
                <div>
                    <div class="t-body-strong" style="margin-bottom: var(--sp-1);"
                         v-text="t('systemAudioHelp.youreOn', { os: platformInfo.os, browser: platformInfo.browser })"></div>
                    <div class="t-meta" v-if="audioCaps.supportsSystemAudio" v-html="t('systemAudioHelp.fullSupport')"></div>
                    <div class="t-meta" v-else-if="audioCaps.supportsTabAudio" v-html="t('systemAudioHelp.tabAudioOnly')"></div>
                    <div class="t-meta" v-else v-text="t('systemAudioHelp.noSupport')"></div>
                </div>
            </div>

            <!-- OS tab strip -->
            <div class="tabs" style="margin-bottom: var(--sp-4);">
                <button @click="helpModalOsTab = 'macOS'"   class="tab" :class="{'is-active': helpModalOsTab === 'macOS'}">
                    <i class="fab fa-apple"></i><span>macOS</span>
                </button>
                <button @click="helpModalOsTab = 'Windows'" class="tab" :class="{'is-active': helpModalOsTab === 'Windows'}">
                    <i class="fab fa-windows"></i><span>Windows</span>
                </button>
                <button @click="helpModalOsTab = 'Linux'"   class="tab" :class="{'is-active': helpModalOsTab === 'Linux'}">
                    <i class="fab fa-linux"></i><span>Linux</span>
                </button>
            </div>

            <!-- macOS -->
            <div v-if="helpModalOsTab === 'macOS'" class="space-y-3">
                <p class="t-body" v-text="t('systemAudioHelp.macIntro')"></p>
                <div>
                    <div class="t-body-strong" style="margin-bottom: var(--sp-1);" v-text="t('systemAudioHelp.optionATabNoInstall')"></div>
                    <ol class="list-decimal list-inside space-y-1 t-body" style="color: var(--text-secondary);">
                        <li v-html="t('systemAudioHelp.macA1')"></li>
                        <li v-html="t('systemAudioHelp.macA2')"></li>
                        <li v-html="t('systemAudioHelp.tickShareTabAudio')"></li>
                    </ol>
                    <p class="t-meta" style="margin-top: var(--sp-2);" v-text="t('systemAudioHelp.macANote')"></p>
                </div>
                <div>
                    <div class="t-body-strong" style="margin-bottom: var(--sp-1);" v-text="t('systemAudioHelp.optionBVirtualDevice')"></div>
                    <ol class="list-decimal list-inside space-y-1 t-body" style="color: var(--text-secondary);">
                        <li v-html="t('systemAudioHelp.macB1', { link: helpLink('https://existential.audio/blackhole/', 'BlackHole 2ch') })"></li>
                        <li v-html="t('systemAudioHelp.macB2')"></li>
                        <li v-html="t('systemAudioHelp.macB3')"></li>
                    </ol>
                    <p class="t-meta" style="margin-top: var(--sp-2);" v-text="t('systemAudioHelp.macBNote')"></p>
                </div>
                <p class="t-meta" v-html="t('systemAudioHelp.macPaid', { link: helpLink('https://rogueamoeba.com/loopback/', 'Loopback') })"></p>
            </div>

            <!-- Windows -->
            <div v-else-if="helpModalOsTab === 'Windows'" class="space-y-3">
                <p class="t-body" v-text="t('systemAudioHelp.winIntro')"></p>
                <div>
                    <div class="t-body-strong" style="margin-bottom: var(--sp-1);" v-text="t('systemAudioHelp.winSystemWide')"></div>
                    <ol class="list-decimal list-inside space-y-1 t-body" style="color: var(--text-secondary);">
                        <li v-html="t('systemAudioHelp.win1')"></li>
                        <li v-html="t('systemAudioHelp.win2')"></li>
                        <li v-html="t('systemAudioHelp.win3')"></li>
                        <li v-html="t('systemAudioHelp.win4')"></li>
                    </ol>
                </div>
                <div>
                    <div class="t-body-strong" style="margin-bottom: var(--sp-1);" v-text="t('systemAudioHelp.winPerWindow')"></div>
                    <ol class="list-decimal list-inside space-y-1 t-body" style="color: var(--text-secondary);">
                        <li v-html="t('systemAudioHelp.winW1')"></li>
                        <li v-text="t('systemAudioHelp.winW2')"></li>
                        <li v-html="t('systemAudioHelp.winW3')"></li>
                    </ol>
                    <p class="t-meta" style="margin-top: var(--sp-2);" v-text="t('systemAudioHelp.winWNote')"></p>
                </div>
                <p class="t-meta" v-html="t('systemAudioHelp.winStuck', { link: helpLink('https://vb-audio.com/Cable/', 'VB-Audio Cable') })"></p>
            </div>

            <!-- Linux -->
            <div v-else-if="helpModalOsTab === 'Linux'" class="space-y-3">
                <p class="t-body" v-text="t('systemAudioHelp.linuxIntro')"></p>

                <div>
                    <div class="t-body-strong" style="margin-bottom: var(--sp-1);" v-text="t('systemAudioHelp.optionATabNoSetup')"></div>
                    <ol class="list-decimal list-inside space-y-1 t-body" style="color: var(--text-secondary);">
                        <li v-text="t('systemAudioHelp.linuxA1')"></li>
                        <li v-html="t('systemAudioHelp.linuxA2')"></li>
                        <li v-html="t('systemAudioHelp.tickShareTabAudio')"></li>
                    </ol>
                    <div class="banner banner--info" style="display: flex; align-items: flex-start; gap: var(--sp-2); margin-top: var(--sp-2);">
                        <i class="fas fa-circle-info" style="margin-top: 2px;"></i>
                        <div>
                            <div class="t-meta" v-html="t('systemAudioHelp.linuxPavucontrolNote')"></div>
                        </div>
                    </div>
                    <p class="t-meta" style="margin-top: var(--sp-2);" v-text="t('systemAudioHelp.linuxANote')"></p>
                </div>

                <div>
                    <div class="t-body-strong" style="margin-bottom: var(--sp-1);" v-text="t('systemAudioHelp.linuxOptionB')"></div>
                    <p class="t-body" style="color: var(--text-secondary);" v-text="t('systemAudioHelp.linuxBIntro')"></p>
                    <ol class="list-decimal list-inside space-y-1 t-body" style="color: var(--text-secondary); margin-top: var(--sp-2);">
                        <li v-html="t('systemAudioHelp.linuxB1')"></li>
                        <li v-html="t('systemAudioHelp.linuxB2', { app: helpCode('pavucontrol') })"></li>
                        <li v-html="t('systemAudioHelp.linuxB3')"></li>
                    </ol>
                </div>

                <div>
                    <div class="t-body-strong" style="margin-bottom: var(--sp-1);" v-text="t('systemAudioHelp.linuxOptionC')"></div>
                    <p class="t-body" style="color: var(--text-secondary);" v-html="t('systemAudioHelp.linuxCWhy')"></p>
                    <div class="banner banner--info" style="display: flex; align-items: flex-start; gap: var(--sp-2); margin: var(--sp-2) 0;">
                        <i class="fas fa-circle-info" style="margin-top: 2px;"></i>
                        <div class="t-meta" style="flex: 1; min-width: 0;">
                            <div class="t-body-strong" style="margin-bottom: var(--sp-1);" v-text="t('systemAudioHelp.quickSetup')"></div>
                            <p v-html="t('systemAudioHelp.linuxCFindSink', { suffix: helpCode('.monitor') })"></p>
                            <pre style="background: var(--bg-secondary); padding: var(--sp-2); border-radius: 4px; margin-top: var(--sp-1); overflow-x: auto; font-size: 11px;">pactl list short sinks</pre>
                            <p style="margin-top: var(--sp-2);" v-text="t('systemAudioHelp.linuxCWrap')"></p>
                            <pre style="background: var(--bg-secondary); padding: var(--sp-2); border-radius: 4px; margin-top: var(--sp-1); overflow-x: auto; font-size: 11px;">pactl load-module module-virtual-source \
    source_name=speakr_loopback \
    master=&lt;sink_name&gt;.monitor</pre>
                            <p style="margin-top: var(--sp-2);" v-html="t('systemAudioHelp.linuxCReload')"></p>
                        </div>
                    </div>
                    <p class="t-meta" v-html="t('systemAudioHelp.linuxCPersist', { line: helpCode('load-module module-virtual-source source_name=speakr_loopback master=&lt;sink_name&gt;.monitor'), file: helpCode('~/.config/pulse/default.pa') })"></p>
                </div>

                <div>
                    <div class="t-body-strong" style="margin-bottom: var(--sp-1);" v-text="t('systemAudioHelp.pipewireTitle')"></div>
                    <p class="t-body" style="color: var(--text-secondary);"
                       v-html="t('systemAudioHelp.pipewireBody', { tool: helpCode('pw-loopback'), command: helpCode('pw-loopback --capture-props=\'node.target=&lt;sink&gt;.monitor\' --playback-props=\'media.class=Audio/Source node.name=speakr_loopback\''), qpwgraph: helpCode('qpwgraph'), helvum: helpCode('helvum') })"></p>
                </div>
            </div>

            <!-- Detected virtual audio devices -->
            <div v-if="virtualAudioDevices && virtualAudioDevices.length > 0"
                 class="banner banner--success"
                 style="display: flex; align-items: flex-start; gap: var(--sp-2); margin-top: var(--sp-4);">
                <i class="fas fa-check-circle" style="margin-top: 2px;"></i>
                <div>
                    <div class="t-body-strong" style="margin-bottom: var(--sp-1);" v-text="t('systemAudioHelp.detectedTitle')"></div>
                    <div class="t-meta">
                        ${ t('systemAudioHelp.detectedIntro') }
                        <ul class="list-disc list-inside" style="margin-top: var(--sp-1);">
                            <li v-for="d in virtualAudioDevices" :key="d.deviceId">
                                <span style="font-family: var(--font-mono, ui-monospace, monospace);" v-text="d.label"></span>.
                                ${ t('systemAudioHelp.detectedPick') }
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Privacy notes. Collapsed by default so the modal
                 stays focused on setup; expandable for users who
                 care about the trade-offs each capture mode makes,
                 especially the Linux virtual-source workaround
                 which removes a Chrome-level privacy protection
                 on the user's machine. -->
            <details style="margin-top: var(--sp-4);">
                <summary class="cursor-pointer flex items-center gap-2" style="list-style: none;">
                    <i class="fas fa-triangle-exclamation text-lg" style="color: var(--text-warn, #d97706);"></i>
                    <h4 class="text-base font-semibold m-0" style="color: var(--text-primary);" v-text="t('systemAudioHelp.privacyTitle')"></h4>
                    <i class="fas fa-chevron-down ml-auto text-xs" style="color: var(--text-muted);"></i>
                </summary>
                <div class="space-y-3" style="margin-top: var(--sp-3);">
                    <p class="t-body" style="color: var(--text-secondary);" v-text="t('systemAudioHelp.privacyIntro')"></p>

                    <div>
                        <div class="t-body-strong" style="margin-bottom: var(--sp-1);" v-text="t('systemAudioHelp.privacyMicTitle')"></div>
                        <p class="t-body" style="color: var(--text-secondary);" v-text="t('systemAudioHelp.privacyMicBody')"></p>
                    </div>

                    <div>
                        <div class="t-body-strong" style="margin-bottom: var(--sp-1);" v-text="t('recording.disableAudioProcessingTitle')"></div>
                        <p class="t-body" style="color: var(--text-secondary);" v-text="t('systemAudioHelp.privacyProcessingBody')"></p>
                    </div>

                    <div>
                        <div class="t-body-strong" style="margin-bottom: var(--sp-1); color: var(--text-warn, #d97706);">
                            <i class="fas fa-triangle-exclamation"></i>
                            <span v-html="t('systemAudioHelp.privacyVirtualTitle', { loopback: helpCode('speakr_loopback') })"></span>
                        </div>
                        <p class="t-body" style="color: var(--text-secondary);"
                           v-html="t('systemAudioHelp.privacyVirtualBody', { api: helpCode('navigator.mediaDevices.enumerateDevices()') })"></p>
                        <p class="t-body" style="color: var(--text-secondary); margin-top: var(--sp-2);" v-text="t('systemAudioHelp.perOsSpecifics')"></p>
                        <ul class="list-disc list-inside space-y-1 t-body" style="color: var(--text-secondary);">
                            <li v-html="t('systemAudioHelp.privacyMac')"></li>
                            <li v-html="t('systemAudioHelp.privacyWindows')"></li>
                            <li v-html="t('systemAudioHelp.privacyLinux', { loopback: helpCode('speakr_loopback'), module: helpCode('module-virtual-source') })"></li>
                        </ul>
                        <div class="t-body-strong" style="margin-top: var(--sp-2); margin-bottom: var(--sp-1);" v-text="t('systemAudioHelp.mitigationsTitle')"></div>
                        <ul class="list-disc list-inside space-y-1 t-body" style="color: var(--text-secondary);">
                            <li v-html="t('systemAudioHelp.mitigationRoute', { unload: helpCode('pactl unload-module module-virtual-source'), load: helpCode('load-module'), file: helpCode('default.pa') })"></li>
                            <li v-html="t('systemAudioHelp.mitigationAudit', { url: helpCode('chrome://settings/content/microphone') })"></li>
                            <li v-html="t('systemAudioHelp.mitigationRename', { example: helpCode('aux_in'), loopback: helpCode('speakr_loopback') })"></li>
                        </ul>
                    </div>

                    <div>
                        <div class="t-body-strong" style="margin-bottom: var(--sp-1);" v-text="t('systemAudioHelp.whereTitle')"></div>
                        <p class="t-body" style="color: var(--text-secondary);" v-text="t('systemAudioHelp.whereBody')"></p>
                    </div>
                </div>
            </details>

        </div>
        <div class="modal-footer">
            <button @click="showSystemAudioHelp = false" class="btn btn--primary" v-text="t('systemAudioHelp.gotIt')"></button>
        </div>
    </div>
</div>
