<!-- Identify Speakers modal, rebuilt for #395.

     State and behaviour: composables/speaker-modal.js (list order, filter,
     name fields, player) and composables/speakers.js (save, auto-identify,
     per-line speaker and text edits, voice suggestions). Pure helpers with
     unit tests: utils/speaker-modal-model.js.

     Layout: speakers on the left, sorted by speaking time by default, with
     speakers under 30 seconds collapsed into one group that can be merged
     into a main speaker. Selecting a speaker shows only their segments on
     the right; "Show all segments" keeps the highlight and adds Previous /
     Next turn buttons. On phones the two panes are tabs.

     Performance: every segment stays in the DOM. .speaker-segment carries
     content-visibility: auto (styles.css), so off-screen rows skip layout
     and paint, and v-memo keys each row on its own speaker's name, so typing
     a name re-renders only that speaker's rows.

     Template rules: no object literals inside ${ } (use v-text), no window.*
     in expressions. -->

<div v-if="showSpeakerModal" @click.self="closeSpeakerModal" class="modal-overlay">
    <div class="modal-panel modal-panel--xl spk-modal" style="height: 90vh; max-height: 90vh;">

        <div class="modal-header">
            <div class="flex-1 min-w-0">
                <h3 class="modal-title" v-text="t('modal.identifySpeakers')"></h3>
                <p class="t-meta" v-if="modalSpeakers.length"
                   v-text="tc('speakerModal.speakerCount', modalSpeakers.length, { count: modalSpeakers.length })"></p>
            </div>
            <button @click="closeSpeakerModal" class="modal-close" :title="t('buttons.close')" :aria-label="t('buttons.close')">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div v-if="modalSpeakers.length > 16"
             class="banner banner--warn"
             style="margin: var(--sp-3) var(--sp-5) 0;">
            <i class="fas fa-exclamation-triangle"></i>
            <div>
                <div class="t-body-strong" v-text="t('help.moreSpeakersThanColors')"></div>
                <div class="t-meta mt-1" v-text="t('help.youHaveXSpeakers', { count: modalSpeakers.length })"></div>
            </div>
        </div>

        <!-- Phone tabs -->
        <div class="lg:hidden flex border-b border-[var(--border-primary)] flex-shrink-0" role="tablist">
            <button @click="speakerModalTab = 'speakers'" role="tab" :aria-selected="speakerModalTab === 'speakers'"
                    class="spk-tab" :class="{ 'is-active': speakerModalTab === 'speakers' }">
                <i class="fas fa-users"></i>
                <span v-text="t('speakerModal.speakersTab')"></span>
            </button>
            <button @click="speakerModalTab = 'transcript'" role="tab" :aria-selected="speakerModalTab === 'transcript'"
                    class="spk-tab" :class="{ 'is-active': speakerModalTab === 'transcript' }">
                <i class="fas fa-file-lines"></i>
                <span v-text="selectedSpeaker ? labelOf(selectedSpeaker) : t('speakerModal.transcriptTab')"></span>
            </button>
        </div>

        <div class="flex flex-col lg:flex-row overflow-hidden" style="flex: 1 1 auto; min-height: 0;">

            <!-- LEFT: speakers -->
            <div class="lg:w-[38%] flex flex-col overflow-hidden lg:border-r border-[var(--border-primary)]"
                 :class="{ 'hidden lg:flex': speakerModalTab !== 'speakers', 'flex-1': speakerModalTab === 'speakers' }">

                <div class="spk-toolbar">
                    <label class="t-label" for="spk-sort" v-text="t('speakerModal.sortBy')"></label>
                    <select id="spk-sort" class="field field--sm" :value="speakerSort" @change="setSpeakerSort($event.target.value)">
                        <option value="duration" :disabled="!speakerStats.hasTimes" v-text="t('speakerModal.sortDuration')"></option>
                        <option value="appearance" v-text="t('speakerModal.sortAppearance')"></option>
                        <option value="name" v-text="t('speakerModal.sortName')"></option>
                    </select>
                </div>

                <div class="spk-list custom-scrollbar">
                    <template v-for="entry in speakerListEntries" :key="entry.key">

                        <!-- Minor speakers group header -->
                        <div v-if="entry.header" class="spk-minor-header">
                            <button class="spk-minor-toggle" @click="showMinorSpeakers = !showMinorSpeakers"
                                    :aria-expanded="showMinorSpeakers">
                                <i class="fas" :class="showMinorSpeakers ? 'fa-chevron-down' : 'fa-chevron-right'"></i>
                                <span class="t-body-strong" v-text="tc('speakerModal.minorSpeakers', minorSpeakers.length, { count: minorSpeakers.length })"></span>
                                <span class="t-meta" v-text="t('speakerModal.minorSpeakersHint', { seconds: minorSpeakerSeconds, time: formatClock(minorSpeakersSeconds) })"></span>
                            </button>
                            <select class="field field--sm" :aria-label="t('speakerModal.mergeAllInto')"
                                    @change="mergeSpeakersInto(minorSpeakers, $event.target.value); $event.target.value = ''">
                                <option value="" v-text="t('speakerModal.mergeAllInto')"></option>
                                <option v-for="target in mainSpeakers" :key="target" :value="target">${ labelOf(target) }</option>
                            </select>
                        </div>

                        <!-- Speaker row -->
                        <div v-else
                             class="spk-row"
                             :class="{ 'is-selected': selectedSpeaker === entry.id, 'is-minor': entry.minor }"
                             @click="selectSpeaker(entry.id, { openTranscript: true })">

                            <div class="spk-row-head">
                                <span :class="speakerColor(entry.id)" class="spk-dot"></span>
                                <span class="spk-label" :title="entry.id">${ entry.id }</span>
                                <span v-if="modalSpeakers.indexOf(entry.id) >= 16" class="pill-status pill-status--warn spk-repeat"
                                      v-text="t('speakerModal.colorRepeats')"></span>
                                <label class="spk-me" @click.stop>
                                    <input type="checkbox"
                                           v-model="speakerMap[entry.id].isMe"
                                           @change="handleIsMeChange(entry.id)"
                                           class="speaker-checkbox w-4 h-4">
                                    <span v-text="t('help.me')"></span>
                                </label>
                            </div>

                            <div class="spk-row-stats">
                                <span class="t-meta" v-text="speakerMeta(entry.id)"></span>
                                <span v-if="speakerStats.hasTimes" class="spk-share" aria-hidden="true">
                                    <span :class="speakerColor(entry.id)" :style="{ width: speakerShare(entry.id) + '%' }"></span>
                                </span>
                                <button v-if="canPlayModalAudio && speakerStats.hasTimes && speakerStats.bySpeaker[entry.id]"
                                        @click.stop="playSpeakerSample(entry.id)"
                                        class="btn btn--icon btn--sm"
                                        :title="t('speakerModal.playSample')" :aria-label="t('speakerModal.playSample')">
                                    <i class="fas fa-play text-[10px]"></i>
                                </button>
                            </div>

                            <div class="spk-name" @click.stop>
                                <div class="relative">
                                    <input type="text"
                                           v-model="speakerMap[entry.id].name"
                                           @focus="onNameFocus(entry.id)"
                                           @input="onNameInput(entry.id)"
                                           @blur="onNameBlur()"
                                           @keydown="onNameKeydown(entry.id, $event)"
                                           :disabled="speakerMap[entry.id].isMe"
                                           class="field field--sm"
                                           :class="{ 'pr-28': topVoiceMatch(entry.id) }"
                                           :placeholder="speakerMap[entry.id].isMe ? currentUserName : t('speakerModal.namePlaceholder', { label: entry.id })"
                                           role="combobox"
                                           :aria-expanded="openNameField === entry.id && nameOptions(entry.id).length > 0"
                                           :aria-controls="'spk-options-' + entry.id"
                                           autocomplete="off">
                                    <button v-if="topVoiceMatch(entry.id)"
                                            @mousedown.prevent
                                            @click="chooseName(entry.id, topVoiceMatch(entry.id).name)"
                                            class="spk-voice-pill"
                                            :title="t('speakerModal.voiceMatchTitle', { name: topVoiceMatch(entry.id).name, similarity: topVoiceMatch(entry.id).similarity })">
                                        <i class="fas fa-waveform-lines text-[9px]"></i>
                                        <span class="truncate max-w-[80px]">${ topVoiceMatch(entry.id).name }</span>
                                        <span class="opacity-75">${ topVoiceMatch(entry.id).similarity }%</span>
                                    </button>
                                </div>

                                <!-- Options render in the flow of the row, so the
                                     scrolling list never clips them. -->
                                <ul v-if="openNameField === entry.id && !speakerMap[entry.id].isMe && nameOptions(entry.id).length"
                                    :id="'spk-options-' + entry.id"
                                    class="spk-options" role="listbox">
                                    <li v-for="(option, i) in nameOptions(entry.id)" :key="option.source + option.name"
                                        role="option" :aria-selected="nameOptionIndex === i"
                                        class="spk-option" :class="{ 'is-active': nameOptionIndex === i, 'is-taken': option.taken }"
                                        @mousedown.prevent
                                        @click="chooseName(entry.id, option.name)">
                                        <i class="fas" :class="option.source === 'voice' ? 'fa-waveform-lines' : 'fa-user'"></i>
                                        <span class="spk-option-name">${ option.name }</span>
                                        <span v-if="option.source === 'voice'" class="t-meta" v-text="t('speakerModal.voiceMatch') + ' ' + option.similarity + '%'"></span>
                                        <span v-else-if="option.taken" class="t-meta" v-text="t('speakerModal.alreadyAssigned')"></span>
                                        <span v-else class="t-meta" v-text="tc('speakerModal.usedTimes', option.useCount, { count: option.useCount })"></span>
                                    </li>
                                </ul>

                                <div v-if="savedSpellingFor(entry.id) && !speakerMap[entry.id].isMe" class="spk-spelling">
                                    <span class="t-meta" v-text="t('speakerModal.savedSpelling', { name: savedSpellingFor(entry.id) })"></span>
                                    <button class="btn btn--quiet btn--sm" @click="chooseName(entry.id, savedSpellingFor(entry.id))"
                                            v-text="t('speakerModal.useSavedSpelling')"></button>
                                </div>

                                <select v-if="entry.minor" class="field field--sm spk-merge"
                                        :aria-label="t('speakerModal.mergeInto')"
                                        @change="mergeSpeakersInto([entry.id], $event.target.value); $event.target.value = ''">
                                    <option value="" v-text="t('speakerModal.mergeInto')"></option>
                                    <option v-for="target in mainSpeakers" :key="target" :value="target">${ labelOf(target) }</option>
                                </select>
                            </div>
                        </div>
                    </template>

                    <button @click="openAddSpeakerModal" class="btn btn--ghost btn--sm w-full spk-add">
                        <i class="fas fa-plus"></i>
                        <span v-text="t('buttons.addSpeaker')"></span>
                    </button>
                </div>
            </div>

            <!-- RIGHT: player, filter bar, transcript -->
            <div class="lg:w-[62%] flex flex-col overflow-hidden spk-right"
                 :class="{ 'hidden lg:flex': speakerModalTab !== 'transcript', 'flex-1': speakerModalTab === 'transcript' }">

                <div class="flex-shrink-0">
                    <div v-if="selectedRecording.audio_deleted_at" class="t-meta flex items-center gap-2">
                        <i class="fas fa-info-circle"></i>
                        <span v-text="t('help.audioDeletedMessage')"></span>
                    </div>
                    <div v-else-if="selectedRecording.incognito" class="t-meta flex items-center gap-2">
                        <i class="fas fa-user-secret"></i>
                        <span v-text="t('speakerModal.incognitoAudio')"></span>
                    </div>
                    <div v-else>
                        <component :is="selectedRecording.mime_type && selectedRecording.mime_type.startsWith('video/') ? 'video' : 'audio'"
                                   ref="speakerModalPlayer"
                                   :class="(selectedRecording.mime_type && selectedRecording.mime_type.startsWith('video/') && !speakerModalVideoCollapsed) ? 'w-full rounded-lg mb-2 spk-video' : 'hidden'"
                                   :key="'speaker-modal-' + selectedRecording.id"
                                   :src="'/audio/' + selectedRecording.id"
                                   :volume="playerVolume"
                                   preload="metadata"
                                   @play="handleModalAudioPlayPause"
                                   @pause="handleModalAudioPlayPause"
                                   @timeupdate="onModalTimeUpdate"
                                   @loadedmetadata="handleModalAudioLoadedMetadata"
                                   @ended="modalAudioIsPlaying = false">
                        </component>
                        <div class="spk-player">
                            <button @click="toggleModalPlayback" class="spk-play"
                                    :title="modalAudioIsPlaying ? t('speakerModal.pause') : t('speakerModal.play')"
                                    :aria-label="modalAudioIsPlaying ? t('speakerModal.pause') : t('speakerModal.play')">
                                <i :class="modalAudioIsPlaying ? 'fas fa-pause' : 'fas fa-play'" class="text-xs"></i>
                            </button>
                            <span class="spk-time">${ formatClock(modalAudioCurrentTime) } / ${ formatClock(modalAudioDuration) }</span>
                            <div class="spk-seek" role="slider" :aria-label="t('speakerModal.seek')"
                                 :aria-valuenow="Math.round(modalAudioProgressPercent)" aria-valuemin="0" aria-valuemax="100"
                                 @click="seekModalPlayer($event, modalAudioDuration)">
                                <div :style="{ width: modalAudioProgressPercent + '%' }"></div>
                            </div>
                            <button @click="toggleModalMute" class="btn btn--icon btn--sm"
                                    :title="audioIsMuted ? t('speakerModal.unmute') : t('speakerModal.mute')"
                                    :aria-label="audioIsMuted ? t('speakerModal.unmute') : t('speakerModal.mute')">
                                <i :class="audioIsMuted || playerVolume === 0 ? 'fas fa-volume-mute' : playerVolume < 0.5 ? 'fas fa-volume-down' : 'fas fa-volume-up'"></i>
                            </button>
                            <input type="range" min="0" max="1" step="0.05"
                                   class="spk-volume hidden sm:block"
                                   :value="audioIsMuted ? 0 : playerVolume"
                                   @input="setModalVolume($event.target.value)"
                                   :aria-label="t('speakerModal.volume')" :title="t('speakerModal.volume')">
                            <button @click="cycleSpeakerModalRate" class="btn btn--icon btn--sm"
                                    :title="t('speakerModal.playbackSpeed')" :aria-label="t('speakerModal.playbackSpeed')">
                                <span class="text-[10px] font-semibold font-mono">${ formatPlaybackRate(modalPlaybackRate) }</span>
                            </button>
                            <button v-if="selectedRecording.mime_type && selectedRecording.mime_type.startsWith('video/')"
                                    @click="toggleSpeakerModalVideo" class="btn btn--icon btn--sm"
                                    :title="speakerModalVideoCollapsed ? t('speakerModal.showVideo') : t('speakerModal.hideVideo')"
                                    :aria-label="speakerModalVideoCollapsed ? t('speakerModal.showVideo') : t('speakerModal.hideVideo')">
                                <i :class="speakerModalVideoCollapsed ? 'fas fa-video' : 'fas fa-video-slash'"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Filter bar -->
                <div class="spk-filter">
                    <template v-if="selectedSpeaker">
                        <span :class="speakerColor(selectedSpeaker)" class="spk-dot"></span>
                        <span class="t-body-strong truncate">${ labelOf(selectedSpeaker) }</span>
                        <span class="t-meta hidden sm:inline" v-text="speakerMeta(selectedSpeaker)"></span>
                        <div class="spk-filter-actions">
                            <template v-if="!onlySelectedSpeaker && selectedSpeakerTurns.length > 0">
                                <button class="btn btn--icon btn--sm" @click="goToTurn(-1)"
                                        :title="t('speakerModal.previousTurn')" :aria-label="t('speakerModal.previousTurn')">
                                    <i class="fas fa-chevron-up"></i>
                                </button>
                                <span class="pill-status pill-status--info tabular-nums">${ currentTurn + 1 } / ${ selectedSpeakerTurns.length }</span>
                                <button class="btn btn--icon btn--sm" @click="goToTurn(1)"
                                        :title="t('speakerModal.nextTurn')" :aria-label="t('speakerModal.nextTurn')">
                                    <i class="fas fa-chevron-down"></i>
                                </button>
                            </template>
                            <button v-if="onlySelectedSpeaker" class="btn btn--quiet btn--sm" @click="showAllSegments"
                                    v-text="t('speakerModal.showAll')"></button>
                            <button v-else class="btn btn--quiet btn--sm" @click="showOnlySelectedSpeaker"
                                    v-text="t('speakerModal.onlyThisSpeaker')"></button>
                            <button class="btn btn--icon btn--sm" @click="clearSelectedSpeaker"
                                    :title="t('speakerModal.clearSelection')" :aria-label="t('speakerModal.clearSelection')">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </template>
                    <span v-else class="t-meta" v-text="t('speakerModal.selectHint')"></span>
                </div>

                <!-- Transcript -->
                <div ref="speakerModalTranscriptRef"
                     class="speaker-modal-transcript custom-scrollbar"
                     style="flex: 1 1 auto; min-height: 0; overflow-y: auto;">
                    <div v-if="speakerModalData.isJson">
                        <div v-for="segment in visibleModalSegments"
                             :key="segment.index"
                             v-memo="[segment.index, segment.speakerId, segment.sentence, speakerMap[segment.speakerId] ? speakerMap[segment.speakerId].name : '', selectedSpeaker === segment.speakerId, !!selectedSpeaker, onlySelectedSpeaker, playingSegmentIndex === segment.index, editingSpeakerIndex === segment.index]"
                             class="speaker-segment spk-seg group"
                             :class="{ 'is-playing': playingSegmentIndex === segment.index, 'is-dimmed': selectedSpeaker && !onlySelectedSpeaker && selectedSpeaker !== segment.speakerId }"
                             :data-segment-index="segment.index">
                            <button v-if="segment.start !== null" class="spk-seg-time" @click="playModalSegment(segment)"
                                    :title="t('speakerModal.play')">${ formatClock(segment.start) }</button>
                            <span v-else></span>
                            <span :class="[speakerColor(segment.speakerId), 'speaker-tag']"
                                  class="spk-seg-speaker" :title="segment.speakerId">${ labelOf(segment.speakerId) }</span>
                            <span class="spk-seg-text" @click="playModalSegment(segment)">${ segment.sentence }</span>
                            <span class="spk-seg-actions">
                                <button @click.stop="openSpeakerChangeDropdown(segment.index)" class="btn btn--icon btn--sm"
                                        :title="t('speakerModal.changeSpeaker')" :aria-label="t('speakerModal.changeSpeaker')">
                                    <i class="fas fa-user-edit text-[10px]"></i>
                                </button>
                                <button @click.stop="openEditTextModal(segment.index)" class="btn btn--icon btn--sm"
                                        :title="t('speakerModal.editText')" :aria-label="t('speakerModal.editText')">
                                    <i class="fas fa-edit text-[10px]"></i>
                                </button>
                            </span>
                            <div v-if="editingSpeakerIndex === segment.index" class="spk-seg-reassign" @click.stop>
                                <select class="field field--sm" :aria-label="t('speakerModal.changeSpeaker')"
                                        @change="changeSpeaker(segment.index, $event.target.value)">
                                    <option value="" v-text="t('speakerModal.changeSpeaker')"></option>
                                    <option v-for="id in orderedSpeakers" :key="id" :value="id" :disabled="id === segment.speakerId">${ labelOf(id) }</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div v-else class="whitespace-pre-wrap text-sm text-[var(--text-primary)]">${ speakerModalData.plainText }</div>
                </div>
            </div>
        </div>

        <div class="flex-shrink-0" style="padding: var(--sp-3) var(--sp-5); background: var(--bg-tertiary); border-top: var(--border-hairline) solid var(--border-primary);">
            <label class="flex items-center text-xs sm:text-sm text-[var(--text-muted)] cursor-pointer hover:text-[var(--text-primary)] transition-colors">
                <input type="checkbox" v-model="regenerateSummaryAfterSpeakerUpdate" class="mr-2 w-4 h-4">
                <span v-text="t('help.regenerateSummaryAfterNames')"></span>
            </label>
        </div>

        <div class="modal-footer modal-footer--between flex-wrap gap-y-2">
            <div class="flex items-center gap-2">
                <div class="relative inline-flex" ref="autoIdSplitBtn">
                    <button @click="autoIdentifySpeakers(false)"
                            class="btn btn--primary"
                            style="border-top-right-radius: 0; border-bottom-right-radius: 0;"
                            :disabled="isAutoIdentifying">
                        <i class="fas fa-magic"></i>
                        <span v-if="!isAutoIdentifying" class="hidden sm:inline" v-text="t('help.autoIdentify')"></span>
                        <span v-if="!isAutoIdentifying" class="sm:hidden" v-text="t('help.autoIdentifyMobile')"></span>
                        <span v-else><i class="fas fa-spinner fa-spin"></i></span>
                    </button>
                    <button @click="showAutoIdDropdown = !showAutoIdDropdown"
                            class="btn btn--primary btn--icon"
                            style="border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 1px solid rgba(255,255,255,0.2);"
                            :disabled="isAutoIdentifying"
                            :aria-label="t('help.identifyAllSpeakers')">
                        <i class="fas fa-caret-down"></i>
                    </button>
                    <div v-if="showAutoIdDropdown"
                         class="absolute bottom-full left-0 mb-1 surface-raised z-50"
                         style="min-width: 200px;">
                        <button @click="autoIdentifySpeakers(true)"
                                class="w-full px-3 py-2 text-left text-sm hover:bg-[var(--bg-tertiary)] transition-colors rounded-md">
                            <i class="fas fa-users mr-2"></i>
                            <span v-text="t('help.identifyAllSpeakers')"></span>
                        </button>
                    </div>
                </div>
                <button v-if="hasAnySuggestions" @click="applySuggestedNames" class="btn btn--primary">
                    <i class="fas fa-lightbulb"></i>
                    <span class="hidden sm:inline" v-text="t('help.applySuggested')"></span>
                    <span class="sm:hidden" v-text="t('help.applySuggestedMobile')"></span>
                </button>
            </div>
            <div class="flex gap-2">
                <button @click="closeSpeakerModal" class="btn btn--ghost" v-text="t('common.cancel')"></button>
                <button @click="saveSpeakerNames"
                        :disabled="!canSaveSpeakerEdits"
                        class="btn btn--primary"
                        v-text="t('buttons.saveNames')"></button>
            </div>
        </div>
    </div>
</div>
