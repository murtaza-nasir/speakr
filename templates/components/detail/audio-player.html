<!-- The player of a recording on a phone: one slim strip above the tab bar
     (play or pause, the time, the current speaker, a thin progress line).
     A tap on the strip opens the player sheet: scrubber, back and forward
     15 seconds, speed and download. There is no volume control; the phone's
     keys set the volume. The media element stays in the strip, so playback
     goes on while the sheet opens and closes. -->
{% from 'components/phone/_sheet.html' import phone_sheet %}
<div data-mobile-player class="ph-player flex-shrink-0">
    <!-- Show message if audio has been deleted -->
    <div v-if="selectedRecording.audio_deleted_at" class="ph-player__note">
        <i class="fas fa-info-circle"></i>
        <span v-text="t('help.audioDeletedMessage')"></span>
    </div>
    <!-- Show message for incognito recordings (no audio stored) -->
    <div v-else-if="selectedRecording.incognito" class="ph-player__note">
        <i class="fas fa-user-secret"></i>
        <span v-text="t('incognito.audioNotStored')"></span>
    </div>
    <!-- Custom Audio Player -->
    <div v-else>
        <!-- Video/Audio element wrapped in Teleport for fullscreen -->
        <Teleport to="body" :disabled="!videoFullscreen">
            <div :class="videoFullscreen ? 'video-fullscreen-overlay' : ''"
                 @mousemove="videoFullscreen && handleFullscreenMouseMove()"
                 @click.self="videoFullscreen && toggleAudioPlayback()">

                <component :is="selectedRecording.mime_type && selectedRecording.mime_type.startsWith('video/') ? 'video' : 'audio'"
                       ref="audioPlayerElement"
                       :src="recordingMediaUrl(selectedRecording)"
                       :volume="playerVolume"
                       @play="handleAudioPlayPause"
                       @pause="handleAudioPlayPause"
                       @timeupdate="handleCustomAudioTimeUpdate"
                       @loadedmetadata="handleAudioLoadedMetadata"
                       @durationchange="handleAudioDurationChange"
                       @ended="handleAudioEnded"
                       @waiting="handleAudioWaiting"
                       @canplay="handleAudioCanPlay"
                       @click="selectedRecording.mime_type && selectedRecording.mime_type.startsWith('video/') && toggleAudioPlayback()"
                       @dblclick="selectedRecording.mime_type && selectedRecording.mime_type.startsWith('video/') && !videoFullscreen && enterVideoFullscreen()"
                       :class="selectedRecording.mime_type && selectedRecording.mime_type.startsWith('video/')
                           ? (videoFullscreen ? 'video-fullscreen-video' : (videoCollapsed ? 'hidden' : 'w-full rounded-lg mb-2 cursor-pointer mobile-player-video'))
                           : 'hidden'">
                </component>

                <!-- Fullscreen Subtitle Overlay -->
                <div v-if="videoFullscreen && currentSubtitle"
                     class="video-fullscreen-subtitle"
                     :class="{ 'subtitle-shifted': fullscreenControlsVisible }">
                    <span v-if="currentSubtitle.speaker"
                          class="video-fullscreen-subtitle-speaker"
                          :style="{ color: 'var(--' + currentSubtitle.color + ')' }">${ currentSubtitle.speaker }:</span>
                    <span>${ currentSubtitle.text }</span>
                </div>

                <!-- Fullscreen Control Bar -->
                <div v-if="videoFullscreen"
                     class="video-fullscreen-controls"
                     :class="{ visible: fullscreenControlsVisible }"
                     @mousemove.stop="handleFullscreenMouseMove()">

                    <!-- Progress Bar -->
                    <div class="px-4 mb-2">
                        <div class="w-full h-5 rounded-full cursor-pointer relative group flex items-center"
                             @mousedown="startProgressDrag"
                             @touchstart.prevent="startProgressDrag">
                            <div class="progress-track w-full h-1 rounded-full relative bg-white/30">
                                <div class="h-full bg-white rounded-full pointer-events-none"
                                     :style="{ width: audioProgressPercent + '%' }"></div>
                            </div>
                            <div class="absolute top-1/2 w-3 h-3 bg-white rounded-full shadow-md transition-transform group-hover:scale-125 pointer-events-none -translate-y-1/2"
                                 :style="{ left: 'clamp(0px, calc(' + audioProgressPercent + '% - 6px), calc(100% - 12px))' }"></div>
                        </div>
                    </div>

                    <!-- Controls Row -->
                    <div class="flex items-center gap-3 px-4 pb-4">
                        <!-- Play/Pause -->
                        <button @click.stop="toggleAudioPlayback"
                                class="w-10 h-10 flex items-center justify-center rounded-full text-white hover:bg-white/20 transition-all">
                            <i :class="audioIsPlaying ? 'fas fa-pause' : 'fas fa-play'" class="text-lg" :style="!audioIsPlaying ? 'margin-left: 2px' : ''"></i>
                        </button>

                        <!-- Volume -->
                        <div class="flex items-center gap-2">
                            <button @click.stop="toggleAudioMute"
                                    class="w-8 h-8 flex items-center justify-center rounded-full text-white hover:bg-white/20 transition-all">
                                <i :class="audioIsMuted || playerVolume === 0 ? 'fas fa-volume-mute' : playerVolume < 0.5 ? 'fas fa-volume-down' : 'fas fa-volume-up'" class="text-sm"></i>
                            </button>
                            <input type="range" min="0" max="1" step="0.05"
                                   :value="audioIsMuted ? 0 : playerVolume"
                                   @input="(e) => setAudioVolume(parseFloat(e.target.value))"
                                   :aria-label="t('speakerModal.volume')"
                                   class="fullscreen-volume-slider w-20">
                        </div>

                        <!-- Time -->
                        <div class="flex items-baseline gap-1 text-white">
                            <span class="text-sm font-mono">${ formatAudioTime(displayCurrentTime) }</span>
                            <span class="text-xs opacity-60">/</span>
                            <span class="text-xs opacity-60 font-mono">${ formatAudioTime(audioDuration) }</span>
                        </div>

                        <div class="flex-1"></div>

                        <!-- Speed -->
                        <button @click.stop="cyclePlaybackRate"
                                class="px-2 h-8 flex items-center justify-center rounded-lg text-white hover:bg-white/20 transition-all"
                                :title="t('tooltips.playbackSpeed')">
                            <span class="text-xs font-semibold font-mono">${ formatPlaybackRate(playbackRate) }</span>
                        </button>

                        <!-- Exit Fullscreen -->
                        <button @click.stop="exitVideoFullscreen"
                                class="w-8 h-8 flex items-center justify-center rounded-full text-white hover:bg-white/20 transition-all"
                                :title="t('tooltips.exitFullscreen')">
                            <i class="fas fa-compress text-sm"></i>
                        </button>
                    </div>
                </div>
            </div>
        </Teleport>

        <!-- The strip (hidden while a video is fullscreen) -->
        <div v-show="!videoFullscreen" class="ph-mp" data-phone-player-strip>
            <div class="ph-mp__track" aria-hidden="true"><div class="ph-mp__line" data-phone-progress :style="{ width: audioProgressPercent + '%' }"></div></div>
            <button type="button" class="ph-ib ph-mp__play" data-phone-play @click="toggleAudioPlayback"
                    :disabled="selectedRecording && selectedRecording.audio_ready === false"
                    :aria-label="(selectedRecording && selectedRecording.audio_ready === false) ? t('mergeRecordings.audioPreparing') : (audioIsPlaying ? t('tooltips.pause') : t('tooltips.play'))"
                    :title="(selectedRecording && selectedRecording.audio_ready === false) ? t('mergeRecordings.audioPreparing') : (audioIsPlaying ? t('tooltips.pause') : t('tooltips.play'))">
                <i :class="audioIsPlaying ? 'fas fa-pause' : 'fas fa-play'" aria-hidden="true"></i>
            </button>
            <button type="button" class="ph-mp__open" data-phone-player-open @click="openPhoneSheet('player')"
                    aria-haspopup="dialog" :aria-label="t('phone.openPlayer')">
                <span class="ph-mp__time" data-phone-time>${ formatAudioTime(displayCurrentTime) } / ${ formatAudioTime(audioDuration) }</span>
                <span class="ph-mp__who" data-phone-speaker dir="auto" v-text="phoneSpeaker"></span>
                <span v-if="playbackRate !== 1" class="ph-mp__rate" v-text="formatPlaybackRate(playbackRate)"></span>
                <span class="ph-mp__chev" aria-hidden="true"><i class="fas fa-chevron-up"></i></span>
            </button>
        </div>
    </div>

    <!-- The player sheet -->
    {% call phone_sheet('player', "selectedRecording.title || t('help.audioPlayer')") %}
    <div class="ph-ps" data-phone-player-sheet>
        <div>
            <div class="ph-ps__scrub" data-phone-scrubber role="slider" tabindex="0"
                 :aria-label="t('phone.position')" aria-valuemin="0" :aria-valuemax="Math.round(audioDuration || 0)"
                 :aria-valuenow="Math.round(displayCurrentTime || 0)" :aria-valuetext="formatAudioTime(displayCurrentTime)"
                 @mousedown="startProgressDrag" @touchstart.prevent="startProgressDrag"
                 @keydown.left.prevent="skipAudio(-5)" @keydown.right.prevent="skipAudio(5)">
                <div class="progress-track ph-ps__track">
                    <div class="ph-ps__fill" :style="{ width: audioProgressPercent + '%' }"></div>
                </div>
                <div class="ph-ps__thumb" :style="{ left: 'clamp(0px, calc(' + audioProgressPercent + '% - 9px), calc(100% - 18px))' }"></div>
            </div>
            <div class="ph-ps__times">
                <span data-phone-sheet-time v-text="formatAudioTime(displayCurrentTime)"></span>
                <span v-text="formatAudioTime(audioDuration)"></span>
            </div>
        </div>
        <div class="ph-ps__main">
            <button type="button" class="ph-ps__skip" data-phone-skip="-15" @click="skipAudio(-15)" :aria-label="t('phone.back15')" :title="t('phone.back15')">
                <i class="fas fa-rotate-left" aria-hidden="true"></i><span>15</span>
            </button>
            <button type="button" class="ph-ps__play" data-phone-sheet-play @click="toggleAudioPlayback"
                    :disabled="selectedRecording && selectedRecording.audio_ready === false"
                    :aria-label="audioIsPlaying ? t('tooltips.pause') : t('tooltips.play')">
                <i :class="audioIsPlaying ? 'fas fa-pause' : 'fas fa-play'" aria-hidden="true"></i>
            </button>
            <button type="button" class="ph-ps__skip" data-phone-skip="15" @click="skipAudio(15)" :aria-label="t('phone.forward15')" :title="t('phone.forward15')">
                <span>15</span><i class="fas fa-rotate-right" aria-hidden="true"></i>
            </button>
        </div>
        <div class="ph-ps__speeds" role="group" :aria-label="t('tooltips.playbackSpeed')" data-phone-speeds>
            <button v-for="speed in playbackSpeeds" :key="speed" type="button" :data-phone-speed="speed"
                    @click="setPlaybackRate(speed)" :aria-pressed="speed === playbackRate ? 'true' : 'false'"
                    v-text="formatPlaybackRate(speed)"></button>
        </div>
    </div>
    <template v-if="selectedRecording.mime_type && selectedRecording.mime_type.startsWith('video/')">
        <button type="button" class="ph-row" data-phone-action="video-toggle" @click="videoCollapsed = !videoCollapsed">
            <i :class="!videoCollapsed ? 'fas fa-video' : 'fas fa-video-slash'" aria-hidden="true"></i>
            <span class="ph-row__label" v-text="!videoCollapsed ? t('tooltips.hideVideo') : t('tooltips.showVideo')"></span>
        </button>
        <button v-if="!videoCollapsed" type="button" class="ph-row" data-phone-action="video-fullscreen" @click="closePhoneSheet(); enterVideoFullscreen()">
            <i class="fas fa-expand" aria-hidden="true"></i><span class="ph-row__label" v-text="t('tooltips.fullscreenVideo')"></span>
        </button>
    </template>
    <a class="ph-row" data-phone-action="player-download" :href="recordingMediaUrl(selectedRecording, {download: true})" download>
        <i class="fas fa-download" aria-hidden="true"></i><span class="ph-row__label" v-text="t('buttons.downloadAudio')"></span>
    </a>
    {% endcall %}
</div>
