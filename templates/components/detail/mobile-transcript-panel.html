<!-- Mobile Transcript Panel. The toolbar (follow-player, view-mode,
     copy / download / edit) now lives in the chevron row of
     mobile-header.html instead of taking a whole separate row here. -->
<div v-if="mobileTab === 'transcript'" class="h-full flex flex-col">
    <div class="flex-grow overflow-y-auto px-3 py-3 relative">
        <!-- Floating Processing Indicator (Mobile) -->
        <div v-if="selectedRecording.status === 'PROCESSING'"
             :class="['processing-indicator-floating', processingIndicatorMinimized ? 'minimized' : '']">
            <template v-if="!processingIndicatorMinimized">
                <div class="processing-indicator-content">
                    <i class="fas fa-spinner fa-spin text-[var(--text-accent)]"></i>
                    <span class="text-sm text-[var(--text-secondary)]" v-text="t('help.processingTranscription')"></span>
                </div>
                <button @click="processingIndicatorMinimized = true"
                        class="processing-indicator-minimize"
                        :title="t('tooltips.minimize')">
                    <i class="fas fa-chevron-up"></i>
                </button>
            </template>
            <template v-else>
                <button @click="processingIndicatorMinimized = false"
                        class="processing-indicator-expand"
                        :title="t('help.processingTranscription')">
                    <i class="fas fa-spinner fa-spin"></i>
                </button>
            </template>
        </div>

        <!-- No transcription state (only show if not processing and no transcription) -->
        <div v-if="!selectedRecording.transcription && selectedRecording.status !== 'PROCESSING'" class="text-center py-8">
            <i class="fas fa-file-text text-3xl text-[var(--text-muted)] mb-3"></i>
            <p class="text-[var(--text-muted)]" v-text="t('transcription.noTranscription')"></p>
        </div>

        <!-- Error Display (when transcription is an error message) -->
        <div v-if="processedTranscription.isError" class="error-display-container p-2">
            {% include 'components/detail/_transcription-error.html' %}
        </div>

        <!-- Translation toggle (mobile) -->
        <div v-if="selectedRecording && selectedRecording.transcription_translation" class="flex items-center gap-2 mb-3 px-1">
            <button @click="viewingTranslation = false" :class="['btn btn--sm', viewingTranslation ? 'btn--ghost' : 'btn--primary']" v-text="t('transcription.title')"></button>
            <button @click="viewingTranslation = true" :class="['btn btn--sm', viewingTranslation ? 'btn--primary' : 'btn--ghost']" v-text="t('translation.title')"></button>
        </div>

        <!-- Translation in progress (mobile): same spinner state as the
             desktop panel and the summary tab. -->
        <div v-if="viewingTranslation && translationJobActive" class="text-center py-8">
            <div class="empty">
                <div class="spinner spinner--lg"></div>
                <div class="empty__title" v-text="t('translation.inProgress')" data-i18n="translation.inProgress"></div>
            </div>
        </div>

        <!-- Empty translation state (mobile) -->
        <div v-if="viewingTranslation && !translationJobActive && !(selectedRecording && selectedRecording.transcription_translation)" class="text-center py-8">
            <i class="fas fa-language text-3xl text-[var(--text-muted)] mb-3"></i>
            <p class="text-[var(--text-muted)] mb-4" v-text="t('translation.noTranslation')"></p>
            <template v-if="selectedRecording && selectedRecording.incognito">
                <div class="flex items-center justify-center gap-2" :title="t('tooltips.translateTranscriptIncognito')">
                    <i class="fas fa-user-secret text-[var(--text-muted)]"></i>
                    <span class="text-sm text-[var(--text-muted)]" v-text="t('translation.incognitoUnavailable')"></span>
                </div>
            </template>
            <template v-else-if="selectedRecording && selectedRecording.can_edit !== false">
                <div class="flex items-center justify-center gap-2">
                    <button @click="generateTranslation()" :disabled="translationJobActive" class="btn btn--primary">
                        <i class="fas fa-language mr-1"></i>
                        <span v-text="t('translation.generate')" data-i18n="translation.generate"></span>
                    </button>
                    <button @click="openTranslationModal" class="btn btn--icon" :title="t('translation.preferences')">
                        <i class="fas fa-sliders-h"></i>
                    </button>
                </div>
            </template>
            <template v-else>
                <p class="text-sm text-[var(--text-muted)]" v-text="t('translation.noTranslation')"></p>
            </template>
        </div>

        <!-- Transcription content (show regardless of processing state if transcription exists) -->
        <div v-if="selectedRecording.transcription && !processedTranscription.isError && !(viewingTranslation && (translationJobActive || !(selectedRecording && selectedRecording.transcription_translation)))">
            <!-- Speaker-run layout: consecutive same-speaker segments
                 grouped under one .speaker-run so the speaker pill at
                 the top of the run can stay sticky for the WHOLE run.
                 Was iterating over the flat simpleSegments before,
                 which meant each segment was its own sticky scope and
                 the pill disappeared as soon as the first segment
                 scrolled past — the "sticky pills don't work" symptom. -->
            <div v-if="!processedTranscription.hasDialogue || transcriptionViewMode === 'simple'" class="transcription-simple-view">
                <div v-if="processedTranscription.hasDialogue">
                    <div v-for="(run, runIndex) in processedTranscription.simpleSegmentRuns"
                         :key="`run-${runIndex}-${run.startTime}`"
                         class="speaker-run">
                        <div v-if="showTimestampsSimpleView"
                             :class="['speaker-tablet-group', run.color]">
                            <span class="speaker-tablet-time">${ formatTimestamp(run.startTime) }</span>
                            <span class="speaker-tablet-name">${run.speaker}</span>
                        </div>
                        <div v-else :class="['speaker-tablet', run.color]">${run.speaker}</div>
                        <div v-for="(segment, segIndex) in run.segments"
                             :key="`seg-${segment.originalIndex}-${segment.startTime}`"
                             :class="['speaker-segment', { 'active-playing-segment': currentPlayingSegmentIndex === segment.originalIndex }]"
                             @click="seekAudioFromEvent"
                             @dblclick.stop="openAsrEditorAtSegment(segment.originalIndex)"
                             :data-start-time="segment.startTime"
                             :data-segment-index="segment.originalIndex">
                            <div class="speaker-text">${segment.sentence}</div>
                        </div>
                    </div>
                </div>
                <div v-else>
                    <div v-if="processedTranscription.simpleSegments && processedTranscription.simpleSegments.length > 0">
                        <div v-for="(segment, index) in processedTranscription.simpleSegments" :key="`seg-${index}-${segment.startTime}`" :class="['transcript-segment cursor-pointer hover:bg-[var(--bg-accent-hover)] p-2 rounded transition-colors', { 'active-playing-segment': currentPlayingSegmentIndex === index }]" @click="seekAudioFromEvent" @dblclick.stop="openAsrEditorAtSegment(index)" :data-start-time="segment.startTime" :data-segment-index="index"><span v-if="showTimestampsSimpleView" class="speaker-segment-timestamp speaker-segment-timestamp--inline">${ formatTimestamp(segment.startTime) }</span>${segment.sentence}</div>
                    </div>
                    <div v-else class="whitespace-pre-wrap bidi-auto">${processedTranscription.content}</div>
                </div>
            </div>
            <div v-else-if="transcriptionViewMode === 'bubble'" class="transcription-with-speakers">
                <!-- Speaker legend (bubble view) — same collapsible legend
                     as desktop; was missing on mobile so users couldn't see
                     who the bubble colours map to. -->
                <div v-if="processedTranscription.speakers && processedTranscription.speakers.length > 0"
                     :class="['speaker-legend', legendExpanded ? 'expanded' : '']">
                    <div class="speaker-legend-header" @click="legendExpanded = !legendExpanded">
                        <div class="speaker-legend-title">
                            <i class="fas fa-users"></i>
                            <span v-text="t('help.speakers')"></span>
                            <span class="speaker-count-indicator">(${processedTranscription.speakers.length})</span>
                        </div>
                        <i class="fas fa-chevron-down speaker-legend-toggle"></i>
                    </div>
                    <div class="speaker-legend-content">
                        <div v-for="(speaker, index) in processedTranscription.speakers"
                             :key="`${selectedRecording.id}-mobile-speaker-legend-${index}`"
                             :class="['speaker-legend-item', speaker.color]">
                            <span class="speaker-name">${speaker.name}</span>
                        </div>
                    </div>
                </div>
                <template v-for="(row, rowIndex) in processedTranscription.bubbleRows" :key="`${selectedRecording.id}-bubble-row-${rowIndex}`">
                    <div :class="['bubble-row', row.isMe ? 'speaker-me' : '']">
                        <div v-for="(bubble, bubbleIndex) in row.bubbles" :key="`bubble-${rowIndex}-${bubbleIndex}-${bubble.startTime}`" :class="['speaker-bubble', bubble.color, row.isMe ? 'speaker-me' : '', { 'active-playing-segment': currentPlayingSegmentIndex === getBubbleGlobalIndex(rowIndex, bubbleIndex) }]" @click="seekAudioFromEvent" :data-start-time="bubble.startTime" :data-segment-index="getBubbleGlobalIndex(rowIndex, bubbleIndex)">
                            <div class="speaker-bubble-content">${bubble.sentence}</div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Translation generation modal (mobile) -->
    <div v-if="showTranslationModal" class="modal-overlay" @click.self="showTranslationModal = false">
        <div class="modal-panel modal-panel--sm">
            <div class="modal-header">
                <h3 class="modal-title" v-text="t('translation.generateTitle')" data-i18n="translation.generateTitle"></h3>
                <button class="modal-close" @click="showTranslationModal = false"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <label class="block text-sm mb-2" v-text="t('translation.targetLanguage')" data-i18n="translation.targetLanguage"></label>
                <select v-model="translationTargetLanguage" class="mt-1 block w-full px-3 py-2 border border-[var(--border-secondary)] rounded-md shadow-sm focus:outline-none focus:ring-[var(--border-focus)] focus:border-[var(--border-focus)] sm:text-sm bg-[var(--bg-input)] text-[var(--text-primary)]">
                    {% for name, iso in output_languages %}
                    <option value="{{ name }}" v-text="t('languages.{{ iso }}')"></option>
                    {% endfor %}
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn btn--ghost" @click="showTranslationModal = false" v-text="t('common.cancel')" data-i18n="common.cancel"></button>
                <button class="btn btn--primary" @click="generateTranslation(translationTargetLanguage)" :disabled="translationJobActive" v-text="t('translation.generate')" data-i18n="translation.generate"></button>
            </div>
        </div>
    </div>
</div>
