<!-- The notes tab of a recording on a phone.

     Same shape as mobile-summary-panel — toolbar hides during editing
     so the edit-pen active-state inconsistency disappears, and the
     editor takes the full panel height with thin outer padding plus a
     sticky Cancel/Save footer. -->
<div v-if="mobileTab === 'notes'" class="ph-pane" :class="{ 'ph-pane--fill': editingNotes }" data-phone-pane="notes">

    <!-- Editing-mode shell — editor goes edge-to-edge. -->
    <div v-if="editingNotes" class="flex-grow flex flex-col min-h-0 pt-1">
        <div class="markdown-editor-container flex-1 min-h-0 flex flex-col">
            <textarea ref="notesMarkdownEditor"
                      v-model="selectedRecording.notes"></textarea>
        </div>
        <div class="flex justify-end gap-2 flex-shrink-0 px-3 py-2 border-t"
             style="border-top-color: var(--border-secondary);">
            <button @click="cancelEditNotes" class="btn btn--sm btn--ghost" v-text="t('common.cancel')"></button>
            <button @click="saveEditNotes" class="btn btn--sm btn--primary" v-text="t('common.save')"></button>
        </div>
    </div>

    <!-- Reading mode: Copy, Download and Edit above the notes. A tap on the
         notes opens the editor, as before. -->
    <div v-else class="ph-pane__body">
        <div class="ph-acts" data-phone-acts="notes">
            <button v-if="selectedRecording.notes" type="button" class="ph-tbtn" @click="copyNotes" :title="t('buttons.copyNotes')">
                <i class="fas fa-copy" aria-hidden="true"></i><span v-text="t('buttons.copy')"></span>
            </button>
            <button v-if="selectedRecording.notes && !selectedRecording.incognito" type="button" class="ph-tbtn" data-phone-download="notes"
                    @click="downloadNotes" :title="t('buttons.downloadNotes')">
                <i class="fas fa-download" aria-hidden="true"></i><span v-text="t('common.download')"></span>
            </button>
            <button type="button" class="ph-tbtn" @click="toggleEditNotes" :title="t('buttons.editNotes')">
                <i class="fas fa-pen" aria-hidden="true"></i><span v-text="t('common.edit')"></span>
            </button>
        </div>
        <div @click="clickToEditNotes">
            <div v-if="!selectedRecording.notes" class="empty">
                <div class="empty__icon"><i class="fas fa-sticky-note"></i></div>
                <div class="empty__title" v-text="t('help.clickToAddNotes')"></div>
                <div class="empty__body" v-text="t('notes.markdownSupported')"></div>
            </div>
            <div v-else class="prose-flush" v-html="notesHtml"></div>
        </div>
    </div>
</div>
