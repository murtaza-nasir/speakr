<!-- The summary tab of a recording on a phone.

     Two modes:
     (1) READING: Copy, Download and Edit above the prose, in the one
         scrolling area of the recording, with the buttons for Events and
         Speaker stats at the end of the same row (they open sheets). In
         edit mode there is no such row, only the editor's own toolbar and
         a Cancel/Save footer.
     (2) EDITING: editor fills the panel edge-to-edge with minimal
         outer padding so the typing area is as large as possible;
         Cancel and Save live in a sticky footer below the editor. -->
{% from 'components/phone/_empty.html' import phone_empty %}
<div v-if="mobileTab === 'summary'" class="ph-pane" :class="{ 'ph-pane--fill': editingSummary }" data-phone-pane="summary">

    <!-- Editing-mode shell — editor goes edge-to-edge (no horizontal
         padding) since the surrounding mobile content area no longer
         wraps it in p-4. Tiny pt-1 keeps the editor toolbar from
         touching the header's bottom border. -->
    <div v-if="editingSummary" class="flex-grow flex flex-col min-h-0 pt-1">
        <div class="markdown-editor-container flex-1 min-h-0 flex flex-col">
            <textarea ref="summaryMarkdownEditor"
                      v-model="selectedRecording.summary"></textarea>
        </div>
        <div class="flex justify-end gap-2 flex-shrink-0 px-3 py-2 border-t"
             style="border-top-color: var(--border-secondary);">
            <button @click="cancelEditSummary" class="btn btn--sm btn--ghost" v-text="t('common.cancel')"></button>
            <button @click="saveEditSummary" class="btn btn--sm btn--primary" v-text="t('common.save')"></button>
        </div>
    </div>

    <!-- Reading mode: Copy, Download and Edit above the text; Events and
         Speaker stats at the end of the same row, with or without a
         summary, so that a long summary is never between the reader and
         them. -->
    <div v-else class="ph-pane__body">
        <div class="ph-acts" data-phone-acts="summary">
            <button v-if="selectedRecording.summary" type="button" class="ph-tbtn" @click="copySummary" :title="t('buttons.copySummary')">
                <i class="fas fa-copy" aria-hidden="true"></i><span v-text="t('buttons.copy')"></span>
            </button>
            <button v-if="selectedRecording.summary && !selectedRecording.incognito" type="button" class="ph-tbtn" data-phone-download="summary"
                    @click="openPhoneSheet('summary-download')" aria-haspopup="dialog" :title="t('buttons.downloadSummary')">
                <i class="fas fa-download" aria-hidden="true"></i><span v-text="t('common.download')"></span>
            </button>
            <button type="button" class="ph-tbtn" @click="toggleEditSummary" :title="t('buttons.editSummary')">
                <i class="fas fa-pen" aria-hidden="true"></i><span v-text="t('common.edit')"></span>
            </button>
            <span v-if="(selectedRecording.events && selectedRecording.events.length > 0) || hasRecordingStats" class="ph-acts__end" data-phone-also>
                <button v-if="selectedRecording.events && selectedRecording.events.length > 0" type="button" class="ph-ib" data-phone-open="events"
                        @click="openPhoneSheet('events')" aria-haspopup="dialog" :aria-label="t('events.title')" :title="t('events.title')">
                    <i class="fas fa-calendar-alt" aria-hidden="true"></i><span class="ph-ib__badge" v-text="selectedRecording.events.length"></span>
                </button>
                <button v-if="hasRecordingStats" type="button" class="ph-ib" data-phone-open="stats"
                        @click="openPhoneSheet('stats')" aria-haspopup="dialog" :aria-label="t('phone.speakerStats')" :title="t('phone.speakerStats')">
                    <i class="fas fa-chart-bar" aria-hidden="true"></i>
                </button>
            </span>
        </div>
        <div>
            <div v-if="selectedRecording.status === 'SUMMARIZING'" class="empty ph-empty" data-phone-empty="summary-busy">
                <div class="ph-empty__mark"><div class="spinner spinner--lg"></div></div>
                <div class="empty__title" v-text="t('help.generatingSummary')"></div>
            </div>
            {% call phone_empty('summary', "t('summary.noSummary')",
                                "processedTranscription.isError ? t('summary.needsTranscription') : t('summary.emptyHint')",
                                icon='fa-file-alt', attrs='v-else-if="!selectedRecording.summary"') %}
                <div class="ph-empty__acts">
                    <button class="btn btn--primary"
                            @click="generateSummary()"
                            :disabled="processedTranscription.isError">
                        <i class="fas fa-magic"></i>
                        <span v-text="t('summary.generateSummary')"></span>
                    </button>
                    <button v-if="!processedTranscription.isError && !selectedRecording.incognito && selectedRecording.can_edit !== false"
                            class="btn btn--ghost btn--icon"
                            @click="openRegenerateSummaryModal(selectedRecording)"
                            :title="t('summary.customizePrompt')">
                        <i class="fas fa-sliders-h"></i>
                    </button>
                </div>
            {% endcall %}
            <div v-else class="prose-flush" v-html="summaryHtml"></div>
        </div>
    </div>
</div>
