<!-- Timeline of the segment editor: the template of the asr-editor-timeline
     component (static/js/modules/asr-editor/timeline.js). Included in
     index.html outside #app, so the page's root template does not compile it.

     The ruler, the waveform and the speaker lanes are one canvas and the
     overview is another; the lane headers beside them are the only part
     rendered by Vue (one row per speaker). A voice match of an unnamed
     speaker is offered in its lane header as in the transcript pane: the
     name and percent (select to hear the speaker) and a button with a word
     on it (Accept, or Merge when the recording already has a speaker of that
     name); the header column is wider while there is one. At phone width the
     column has no room, and the matches are listed above the lanes.
     The name of a lane is a button of its own: it opens the speaker picker
     of the pane for the whole speaker (rename, or merge into another one).
     The header cell of the overview has the button that adds a speaker
     without segments (its words are hidden at phone width), and the lane of
     a speaker without segments has a button that removes it.
     The canvas reads its colours from
     the --tl-* variables of .asr-tl and from the header swatches, which carry
     the .speaker-color-N classes of the transcript.
     Trim (#660): the scissors button in the bar starts trim mode. Handles on
     the canvas and the two fields of the trim bar set the part to keep;
     Preview plays a few seconds at each cut, and Trim asks before the audio
     and the transcript are cut on the server. -->
<script type="text/x-template" id="asr-editor-timeline-template">
<section class="asr-tl" :class="{ 'asr-tl--trimming': trimming, 'asr-tl--closed': !open, 'asr-tl--matches': !narrow && lanes.some((lane) => lane.match), 'asr-tl--empties': lanes.some((lane) => lane.empty) }" ref="root" data-asr-timeline :aria-label="t('asrEditor.timeline.title')">
    <div class="asr-tl__bar">
        <button type="button" class="asr-tl__toggle" data-asr-action="timeline-toggle" :aria-expanded="open ? 'true' : 'false'"
                @click="toggleOpen" :title="open ? t('asrEditor.timeline.hide') : t('asrEditor.timeline.show')">
            <i class="fas text-xs" :class="open ? 'fa-chevron-down' : 'fa-chevron-right'" aria-hidden="true"></i>
            <span v-text="t('asrEditor.timeline.title')"></span>
        </button>
        <span v-if="open && waveState === 'loading'" class="asr-tl__status" role="status" data-asr-timeline-status>
            <i class="fas fa-spinner fa-spin" aria-hidden="true"></i>
            <span v-text="t('asrEditor.timeline.waveformLoading')"></span>
        </span>
        <button v-if="canTrim" type="button" class="asr-tl__trim-btn" data-asr-action="trim"
                :aria-pressed="trimming ? 'true' : 'false'" :disabled="trimming"
                @click="startTrim" :title="t('asrEditor.trim.start')">
            <i class="fas fa-scissors" aria-hidden="true"></i>
            <span v-text="t('asrEditor.trim.button')"></span>
        </button>
        <div v-if="open" class="asr-tl__zoom">
            <button type="button" class="asr-tl__btn" data-asr-action="timeline-zoom-out" @click="zoomOut"
                    :title="t('asrEditor.timeline.zoomOut')" :aria-label="t('asrEditor.timeline.zoomOut')"><i class="fas fa-magnifying-glass-minus"></i></button>
            <button type="button" class="asr-tl__btn" data-asr-action="timeline-zoom-in" @click="zoomIn"
                    :title="t('asrEditor.timeline.zoomIn')" :aria-label="t('asrEditor.timeline.zoomIn')"><i class="fas fa-magnifying-glass-plus"></i></button>
            <button type="button" class="asr-tl__btn" data-asr-action="timeline-zoom-fit" @click="zoomFit"
                    :title="t('asrEditor.timeline.zoomFit')" :aria-label="t('asrEditor.timeline.zoomFit')"><i class="fas fa-arrows-left-right"></i></button>
        </div>
    </div>
    <div v-if="trimming" class="asr-tl__trim" data-asr-trim role="group" :aria-label="t('asrEditor.trim.title')">
        <p class="asr-tl__trim-hint" v-text="t('asrEditor.trim.hint')"></p>
        <div class="asr-tl__trim-row">
            <label class="asr-tl__trim-field">
                <span v-text="t('asrEditor.trim.startLabel')"></span>
                <input type="text" inputmode="decimal" class="asr-tl__trim-input" data-asr-trim-start
                       :class="{ 'is-invalid': trimInvalid === 'start' }" :aria-invalid="trimInvalid === 'start' ? 'true' : 'false'"
                       :value="trimStartText" @change="setTrimField('start', $event.target.value)"
                       @keydown.enter.prevent="setTrimField('start', $event.target.value)">
            </label>
            <label class="asr-tl__trim-field">
                <span v-text="t('asrEditor.trim.endLabel')"></span>
                <input type="text" inputmode="decimal" class="asr-tl__trim-input" data-asr-trim-end
                       :class="{ 'is-invalid': trimInvalid === 'end' }" :aria-invalid="trimInvalid === 'end' ? 'true' : 'false'"
                       :value="trimEndText" @change="setTrimField('end', $event.target.value)"
                       @keydown.enter.prevent="setTrimField('end', $event.target.value)">
            </label>
            <span class="asr-tl__trim-kept" data-asr-trim-kept>
                <span v-text="trimKept"></span>
                <span class="asr-tl__trim-effect" data-asr-trim-effect v-text="trimEffectText"></span>
            </span>
        </div>
        <div class="asr-tl__trim-row asr-tl__trim-actions">
            <label v-if="hasSummary" class="asr-tl__trim-summary" data-asr-trim-summary>
                <input type="checkbox" v-model="trimSummary">
                <span v-text="t('asrEditor.trim.regenerateSummary')"></span>
            </label>
            <button type="button" class="btn btn--ghost btn--sm" data-asr-action="trim-preview" @click="previewTrim">
                <i class="fas fa-play text-xs" aria-hidden="true"></i>
                <span v-text="t('asrEditor.trim.preview')"></span>
            </button>
            <button type="button" class="btn btn--ghost btn--sm" data-asr-action="trim-cancel" @click="cancelTrim"
                    :disabled="trimSending" v-text="t('common.cancel')"></button>
            <button type="button" class="btn btn--danger btn--sm" data-asr-action="trim-apply" @click="applyTrim" :disabled="trimSending">
                <i class="fas text-xs" :class="trimSending ? 'fa-spinner fa-spin' : 'fa-scissors'" aria-hidden="true"></i>
                <span v-text="t('asrEditor.trim.apply')"></span>
            </button>
        </div>
    </div>
    <div v-if="open && narrow && lanes.some((lane) => lane.match)" class="asr-tl__matches" data-asr-timeline-matches>
        <div v-for="lane in lanes.filter((lane) => lane.match)" :key="lane.name" class="asr-tl__match">
            <span class="asr-tl__swatch" :class="lane.color" v-text="lane.number"></span>
            <span class="asr-tl__match-label" v-text="lane.label"></span>
            <span class="asr-suggest asr-suggest--lane" data-asr-lane-suggestion>
                <button type="button" class="asr-suggest__name" @click="previewSpeaker(lane.name)" :title="t('asrEditor.suggestionPlay')">
                    <i class="fas fa-wave-square" aria-hidden="true"></i>
                    <span v-text="lane.match"></span>
                    <i class="fas fa-play asr-suggest__play" aria-hidden="true"></i>
                </button>
                <button type="button" class="asr-suggest__accept" data-asr-action="timeline-accept" @click="acceptSuggestion(lane.name)"
                        :title="lane.merge || null" v-text="lane.merge ? t('asrEditor.merge') : t('asrEditor.suggestionAccept')"></button>
            </span>
        </div>
    </div>
    <div class="asr-tl__body" v-show="open">
        <div class="asr-tl__grid">
            <div class="asr-tl__heads" ref="heads">
                <div class="asr-tl__head-ruler" :style="{ height: rulerHeight + 'px' }"></div>
                <div class="asr-tl__head-audio" :style="{ height: waveHeight + 'px' }" v-text="t('asrEditor.timeline.audio')"></div>
                <div v-for="lane in lanes" :key="lane.name" class="asr-tl__lane" :style="{ height: laneHeight + 'px' }" :data-asr-lane="lane.index">
                    <span class="asr-tl__swatch" :class="lane.color" data-asr-lane-swatch
                          :title="lane.number ? t('asrEditor.timeline.laneKey', { key: lane.number }) : null" v-text="lane.number"></span>
                    <button type="button" class="asr-tl__name" data-asr-action="lane-rename" aria-haspopup="dialog"
                            :title="lane.rename" :aria-label="lane.rename" @click="renameSpeaker(lane.name, $event)">
                        <span class="asr-tl__name-text" v-text="lane.label"></span>
                        <i class="fas fa-pen asr-tl__name-edit" aria-hidden="true"></i>
                    </button>
                    <span v-if="lane.match && !narrow" class="asr-suggest asr-suggest--lane" data-asr-lane-suggestion>
                        <button type="button" class="asr-suggest__name" @click="previewSpeaker(lane.name)" :title="t('asrEditor.suggestionPlay')">
                            <i class="fas fa-wave-square" aria-hidden="true"></i>
                            <span v-text="lane.match"></span>
                            <i class="fas fa-play asr-suggest__play" aria-hidden="true"></i>
                        </button>
                        <button type="button" class="asr-suggest__accept" data-asr-action="timeline-accept" @click="acceptSuggestion(lane.name)"
                        :title="lane.merge || null" v-text="lane.merge ? t('asrEditor.merge') : t('asrEditor.suggestionAccept')"></button>
                    </span>
                    <button v-if="lane.empty" type="button" class="asr-tl__remove" data-asr-action="lane-remove"
                            :title="t('asrEditor.removeSpeaker')" :aria-label="t('asrEditor.removeSpeaker')" @click="removeSpeaker(lane.name)">
                        <i class="fas fa-trash" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <div class="asr-tl__box" ref="box">
                <canvas ref="canvas" class="asr-tl__canvas" tabindex="0" data-asr-timeline-canvas :aria-label="t('asrEditor.timeline.canvasLabel')"></canvas>
            </div>
            <div class="asr-tl__mini-label">
                <span class="asr-tl__mini-text" v-text="t('asrEditor.timeline.overview')"></span>
                <button type="button" class="asr-tl__add-btn" data-asr-action="add-speaker" @click="addSpeaker"
                        :title="t('asrEditor.addSpeaker')" :aria-label="t('asrEditor.addSpeaker')">
                    <i class="fas fa-plus" aria-hidden="true"></i>
                    <span class="asr-tl__add-text" v-text="t('asrEditor.addSpeaker')"></span>
                </button>
            </div>
            <div class="asr-tl__mini-box">
                <canvas ref="mini" class="asr-tl__mini" data-asr-timeline-overview :style="{ height: overviewHeight + 'px' }" :aria-label="t('asrEditor.timeline.overviewLabel')"></canvas>
            </div>
        </div>
    </div>
    <div class="asr-tl__tip" ref="tip" hidden></div>
</section>
</script>
